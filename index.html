<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>S2S Real Estate Quoting App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    :root {
      --bg: #f3f5f8;
      --surface-tile: #f3f5f8;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --s2s-red: #e60000;
      --shadow-light: #ffffff;
      --shadow-dark: #d1d9e6;
      --inset-dark: #cbd5e1;
      --border-highlight: rgba(255, 255, 255, 0.9);
      --border-radius: 24px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --surface-tile: #161b22;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --s2s-red: #ff3333;
      --shadow-light: #21262d;
      --shadow-dark: #030712;
      --inset-dark: #090d14;
      --border-highlight: rgba(255, 255, 255, 0.05);
    }

    body {
      background: #04060a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      border-radius: clamp(0px, 4vw, 40px);
    }

    /* MODERN WHITE S2S SPLASH SCREEN */
    .splash-overlay {
      position: absolute;
      inset: 0;
      background: #ffffff;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.5s var(--ease-smooth), transform 0.5s var(--ease-smooth);
    }

    .splash-overlay.hide {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.06);
    }

    .splash-brand {
      font-size: clamp(56px, 15vw, 72px);
      font-weight: 900;
      color: #000000;
      letter-spacing: -3px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: splashPulse 1.4s var(--ease-spring) infinite alternate;
    }

    .splash-brand span {
      color: #e60000;
    }

    .splash-tagline {
      margin-top: 16px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #94a3b8;
    }

    @keyframes splashPulse {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.02); }
    }

    /* TOAST NOTIFICATION CONTAINER */
    .toast-container {
      position: absolute;
      top: calc(max(24px, env(safe-area-inset-top)) + 64px);
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 999;
      pointer-events: none;
    }

    .toast {
      background: var(--text-primary);
      color: var(--bg);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 12px 24px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(-15px) scale(0.9);
      transition: all 0.4s var(--ease-spring);
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* PERFECTLY BALANCED TOP NAVIGATION USING 3-COLUMN GRID */
    .top-nav {
      padding-top: calc(max(24px, env(safe-area-inset-top)) + 12px);
      padding-left: clamp(16px, 5vw, 24px);
      padding-right: clamp(16px, 5vw, 24px);
      padding-bottom: 12px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      flex-shrink: 0;
      min-height: calc(max(24px, env(safe-area-inset-top)) + 56px);
      z-index: 50;
    }

    .nav-left {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .nav-center {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .brand-btn {
      padding: 8px 18px;
      border-radius: 16px;
      background: var(--surface-tile);
      box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
      border: 1px solid var(--border-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s var(--ease-spring), box-shadow 0.18s ease;
    }
    .brand-btn:active {
      box-shadow: inset 3px 3px 6px var(--inset-dark), inset -3px -3px 6px var(--shadow-light);
      transform: scale(0.94);
    }

    .brand-logo {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.8px;
      line-height: 1;
    }
    .brand-logo span { color: var(--s2s-red); }

    /* HARMONIZED SQUIRCLE ICON BUTTONS */
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: var(--surface-tile);
      box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
      border: 1px solid var(--border-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      cursor: pointer;
      transition: transform 0.18s var(--ease-spring), box-shadow 0.18s ease;
    }
    .icon-btn:active {
      box-shadow: inset 3px 3px 6px var(--inset-dark), inset -3px -3px 6px var(--shadow-light);
      transform: scale(0.90);
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    /* VIEW CANVAS */
    .view-container { flex: 1; position: relative; overflow: hidden; }
    
    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.45s var(--ease-smooth);
      transform: scale(0.94) translateY(20px);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .screen::-webkit-scrollbar { display: none; }
    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
    }

    /* SCREEN 1 */
    #screen-1 {
      padding: 12px clamp(16px, 5vw, 22px) 100px clamp(16px, 5vw, 22px);
      justify-content: center;
    }
    #screen-1 .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(12px, 4vw, 18px);
      width: 100%;
      margin: auto 0;
    }

    #screen-1 .tile {
      background: var(--surface-tile);
      border-radius: var(--border-radius);
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
      border: 1px solid var(--border-highlight);
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.2s var(--ease-spring), box-shadow 0.2s ease, opacity 0.3s ease;
    }
    #screen-1 .tile:active {
      box-shadow: inset 5px 5px 10px var(--inset-dark), inset -5px -5px 10px var(--shadow-light);
      transform: scale(0.94);
    }

    #screen-1 .icon-well {
      width: clamp(56px, 16vw, 72px);
      height: clamp(56px, 16vw, 72px);
      border-radius: 20px;
      background: var(--surface-tile);
      box-shadow: inset 4px 4px 9px var(--inset-dark), inset -4px -4px 9px var(--shadow-light);
      border: 1px solid var(--border-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      pointer-events: none;
    }
    #screen-1 .icon-well svg {
      width: clamp(28px, 8vw, 38px);
      height: clamp(28px, 8vw, 38px);
      stroke: var(--s2s-red);
      fill: none;
      stroke-width: 2.2;
    }

    #screen-1 .tile-label { 
      font-size: clamp(13px, 3.8vw, 15px); 
      font-weight: 700; 
      color: var(--text-primary); 
      text-align: center;
    }

    /* SCREEN 2 */
    #screen-2 {
      padding: 10px clamp(14px, 4vw, 20px) 100px clamp(14px, 4vw, 20px);
      justify-content: flex-start;
      gap: 14px;
    }

    .screen-header-s2 { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .s2-top-row { display: flex; align-items: center; gap: 10px; }

    .raised-header-box {
      flex: 1;
      padding: 10px 14px;
      border-radius: 16px;
      background: var(--bg);
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      border: 1px solid var(--border-highlight);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .raised-header-box svg { width: 22px; height: 22px; stroke: var(--s2s-red); fill: none; stroke-width: 2.2; }
    .s2-title { font-size: 18px; font-weight: 900; color: var(--text-primary); }

    .raised-filter-group { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 8px; 
      width: 100%; 
    }
    
    .raised-filter-btn {
      border: none;
      background: var(--bg);
      padding: 10px 0;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      border: 1px solid var(--border-highlight);
      transition: all 0.22s var(--ease-spring);
    }
    .raised-filter-btn.active {
      background: var(--s2s-red);
      color: #ffffff;
      box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4), inset -2px -2px 4px rgba(255,255,255,0.3);
      transform: scale(0.97);
    }

    #screen-2 .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      margin-top: 6px;
    }

    #screen-2 .tile {
      background: var(--bg);
      border-radius: 20px;
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      border: 1px solid var(--border-highlight);
      aspect-ratio: 1 / 0.95;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.2s var(--ease-spring), box-shadow 0.2s ease;
    }
    #screen-2 .tile:active {
      box-shadow: inset 5px 5px 10px var(--inset-dark), inset -5px -5px 10px var(--shadow-light);
      transform: scale(0.94);
    }

    #screen-2 .icon-well {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--bg);
      box-shadow: inset 4px 4px 8px var(--inset-dark), inset -4px -4px 8px var(--shadow-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }
    #screen-2 .icon-well svg { width: 30px; height: 30px; stroke: var(--s2s-red); fill: none; stroke-width: 2.2; }

    #screen-2 .tile-label { font-size: 13px; font-weight: 800; color: var(--text-primary); text-align: center; }
    #screen-2 .tile-price { font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-top: 2px; }

    /* ROW-BY-ROW STAGGERED CASCADING ENTRANCE */
    .cascading-tile {
      opacity: 0;
      transform: translateY(28px) scale(0.88);
      transition: opacity 0.38s ease, transform 0.45s var(--ease-spring);
    }
    
    /* Row 1 (Items 1 & 2) */
    .screen.active .cascading-tile:nth-child(1),
    .screen.active .cascading-tile:nth-child(2) { 
      opacity: 1; 
      transform: translateY(0) scale(1); 
      transition-delay: 0.05s; 
    }
    
    /* Row 2 (Items 3 & 4) */
    .screen.active .cascading-tile:nth-child(3),
    .screen.active .cascading-tile:nth-child(4) { 
      opacity: 1; 
      transform: translateY(0) scale(1); 
      transition-delay: 0.18s; 
    }
    
    /* Row 3 (Items 5 & 6) */
    .screen.active .cascading-tile:nth-child(5),
    .screen.active .cascading-tile:nth-child(6) { 
      opacity: 1; 
      transform: translateY(0) scale(1); 
      transition-delay: 0.31s; 
    }

    /* FLOATING PILL BOTTOM NAVIGATION WITH HARMONIZED SQUIRCLE BUTTONS */
    .bottom-nav {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: clamp(16px, 5vw, 24px);
      right: clamp(16px, 5vw, 24px);
      height: 64px;
      background: var(--surface-tile);
      border-radius: 24px;
      border: 1px solid var(--border-highlight);
      box-shadow: 10px 10px 24px var(--shadow-dark), -8px -8px 20px var(--shadow-light);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 12px;
      z-index: 100;
      transition: transform 0.4s var(--ease-smooth);
    }
    .bottom-nav.nav-hidden { transform: translateY(120px); }

    .bottom-nav .nav-item {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--surface-tile);
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      border: 1px solid var(--border-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: transform 0.2s var(--ease-spring), color 0.2s ease, box-shadow 0.2s ease;
    }
    .bottom-nav .nav-item.active {
      color: var(--s2s-red);
      box-shadow: inset 3px 3px 6px var(--inset-dark), inset -3px -3px 6px var(--shadow-light);
      transform: scale(0.94);
    }
    .bottom-nav .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    /* BOTTOM SHEET & BACKDROP SCRIM */
    .bottom-sheet-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .bottom-sheet-overlay.active { opacity: 1; pointer-events: auto; }

    .bottom-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      border-radius: 32px 32px 0 0;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
      padding: 12px clamp(16px, 5vw, 24px) max(24px, env(safe-area-inset-bottom)) clamp(16px, 5vw, 24px);
      z-index: 201;
      transform: translateY(100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      touch-action: none;
      will-change: transform;
    }
    .bottom-sheet.animate-snap {
      transition: transform 0.4s var(--ease-smooth);
    }

    .sheet-handle-wrapper { 
      width: 100%; 
      padding: 8px 0; 
      cursor: grab; 
      display: flex; 
      justify-content: center; 
      align-items: center;
    }
    .sheet-handle { 
      width: 44px; 
      height: 5px; 
      border-radius: 3px; 
      background: var(--shadow-dark); 
      transition: transform 0.3s ease, width 0.3s ease, border-radius 0.3s ease;
    }
    .bottom-sheet.expanded .sheet-handle {
      width: 18px;
      height: 18px;
      background: transparent;
      border-left: 3px solid var(--text-secondary);
      border-bottom: 3px solid var(--text-secondary);
      transform: rotate(-45deg);
      border-radius: 2px;
    }

    .sheet-header-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .sheet-header-left { display: flex; align-items: center; gap: 12px; }
    .sheet-header-left .icon-well { 
      width: 46px; 
      height: 46px; 
      border-radius: 14px; 
      flex-shrink: 0; 
      margin: 0; 
      background: var(--bg);
      box-shadow: inset 3px 3px 6px var(--inset-dark), inset -3px -3px 6px var(--shadow-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sheet-header-left .icon-well svg { width: 24px; height: 24px; stroke: var(--s2s-red); fill: none; stroke-width: 2.2; }
    
    .sheet-title-stack { display: flex; flex-direction: column; }
    .sheet-eyebrow { font-size: 11px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .sheet-main-title { font-size: 20px; font-weight: 900; color: var(--text-primary); line-height: 1.1; }

    .close-sheet-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border-highlight);
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .close-sheet-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; }

    .hero-price-container {
      width: 100%;
      padding: 8px 0;
      border-radius: 18px;
      background: var(--bg);
      box-shadow: inset 4px 4px 8px var(--inset-dark), inset -4px -4px 8px var(--shadow-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sheet-hero-price-4x {
      font-size: clamp(36px, 10vw, 44px);
      font-weight: 900;
      color: var(--s2s-red);
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
      letter-spacing: -1.5px;
    }
    .sheet-hero-price-4x .cents { font-size: 22px; font-weight: 800; }
    .tax-badge-centered {
      font-size: 10px;
      font-weight: 800;
      background: var(--shadow-dark);
      color: var(--text-primary);
      padding: 2px 7px;
      border-radius: 6px;
      margin-left: 8px;
    }

    .pill-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
    .pill-btn {
      background: var(--bg);
      border-radius: 14px;
      padding: 10px 4px;
      text-align: center;
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      border: 1px solid var(--border-highlight);
      cursor: pointer;
      transition: all 0.22s var(--ease-spring);
    }
    .pill-btn.active {
      box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.45), inset -2px -2px 5px rgba(255, 255, 255, 0.25);
      background: var(--s2s-red);
      transform: scale(0.96);
    }
    .pill-btn.active .count, .pill-btn.active .price { color: #ffffff !important; }
    .pill-btn .count { font-size: 15px; font-weight: 900; color: var(--text-primary); }
    .pill-btn .price { font-size: 11px; color: var(--text-secondary); margin-top: 1px; font-weight: 700; }

    .line-item-card {
      width: 100%;
      padding: 10px 16px;
      border-radius: 16px;
      background: var(--bg);
      box-shadow: inset 4px 4px 8px var(--inset-dark), inset -4px -4px 8px var(--shadow-light);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .line-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--text-primary); }
    .line-row.sub { color: var(--text-secondary); font-weight: 700; transition: color 0.2s ease; }
    .line-row.sub.active-extra { color: var(--s2s-red) !important; font-weight: 900 !important; }

    .stepper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      width: 100%;
      background: var(--bg);
      border-radius: 16px;
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      border: 1px solid var(--border-highlight);
    }
    .stepper-controls { display: flex; align-items: center; gap: 12px; }
    .step-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg);
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
      border: 1px solid var(--border-highlight);
      font-weight: 900;
      font-size: 16px;
      color: var(--text-primary);
      cursor: pointer;
      transition: transform 0.15s var(--ease-spring);
    }
    .step-btn:active {
      box-shadow: inset 3px 3px 6px var(--inset-dark), inset -3px -3px 6px var(--shadow-light);
      transform: scale(0.90);
    }
    .step-value { font-size: 16px; font-weight: 900; color: var(--s2s-red); min-width: 22px; text-align: center; }

    .cta-button-icon {
      width: 100%;
      height: 50px;
      border-radius: 16px;
      background: var(--s2s-red);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(230, 0, 0, 0.35);
      transition: transform 0.2s var(--ease-spring), box-shadow 0.2s ease;
    }
    .cta-button-icon:active { transform: scale(0.96); box-shadow: inset 4px 4px 8px rgba(0,0,0,0.5); }
    .cta-button-icon svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body data-theme="light">

  <div id="app-container">

    <!-- CLEAN MODERN WHITE S2S SPLASH SCREEN -->
    <div class="splash-overlay" id="splash-screen">
      <div class="splash-brand">s<span>2</span>s</div>
      <div class="splash-tagline">Real Estate Media</div>

    <!-- QUEUED TOAST NOTIFICATIONS -->

    <!-- TOP NAVIGATION (BALANCED 3-COLUMN LAYOUT) -->

        <button class="icon-btn" id="theme-toggle" aria-label="Toggle Theme">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>

        </button>
      </div>
    </header>

    <main class="view-container">

      <!-- SCREEN 1 -->
      <section class="screen active" id="screen-1">
        <div class="grid-container" id="home-grid">
          
          <div class="tile" data-label="Photos" data-icon="camera">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
            <div class="tile-label">Photos</div>
          </div>

          <div class="tile" data-label="Aerial" data-icon="aerial">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M12 10a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/><path d="M7 6.5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0z"/><path d="M22 6.5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0z"/><path d="M7 17.5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0z"/><path d="M22 17.5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0z"/><path d="M5.5 8.5l4.5 2.5M18.5 8.5l-4.5 2.5M5.5 15.5l4.5-2.5M18.5 15.5l-4.5-2.5"/></svg>

            </div>
            <div class="tile-label">Add-Ons</div>
          </div>

        </div>
      </section>

      <!-- SCREEN 2 -->
      <section class="screen" id="screen-2">
        <div class="screen-header-s2">
          <div class="s2-top-row">
            <button class="icon-btn" id="back-to-1" aria-label="Back">
              <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div class="raised-header-box" id="s2-header-target">
              <svg id="s2-header-icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              <div class="s2-title" id="s2-header-title">Photos</div>
            </div>
          </div>
          <div class="raised-filter-group">
            <button class="raised-filter-btn active">MLS</button>
            <button class="raised-filter-btn">Airbnb</button>
            <button class="raised-filter-btn">PORT</button>
          </div>
        </div>

        <div class="grid-container">
          <div class="tile cascading-tile" id="open-full-shoot">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3"/></svg>
            </div>
            <div class="tile-label">Full Shoot</div>
            <div class="tile-price">from $139</div>
          </div>

          <div class="tile cascading-tile">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            </div>
            <div class="tile-label">Reshoot</div>
            <div class="tile-price">from $99</div>
          </div>

          <div class="tile cascading-tile">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
            </div>
            <div class="tile-label">Ranch Shoot</div>
            <div class="tile-price">from $199</div>
          </div>

          <div class="tile cascading-tile">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div class="tile-label">Exterior Only</div>
            <div class="tile-price">from $89</div>
          </div>

          <div class="tile cascading-tile">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="3" x2="12" y2="9"/></svg>
            </div>
            <div class="tile-label">Mini Shoot</div>
            <div class="tile-price">from $109</div>
          </div>

          <div class="tile cascading-tile">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M10 20l4-16M6 8l-4 4 4 4M18 8l4 4-4 4"/></svg>
            </div>
            <div class="tile-label">Airbnb</div>
            <div class="tile-price">from $159</div>
          </div>
        </div>
      </section>

    </main>

    <!-- ACCESSIBLE BOTTOM SHEET DIALOG -->
    <div class="bottom-sheet-overlay" id="sheet-overlay"></div>
    
    <div class="bottom-sheet" id="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      
      <div class="sheet-handle-wrapper" id="sheet-handle-bar">
        <div class="sheet-handle"></div>
      </div>
      
      <div class="sheet-header-row">
        <div class="sheet-header-left">
          <div class="icon-well">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3"/></svg>
          </div>
          <div class="sheet-title-stack">
            <span class="sheet-eyebrow">MLS Photos</span>
            <h2 class="sheet-main-title" id="sheet-title">Full Shoot</h2>
          </div>
        </div>
        <button class="close-sheet-btn" id="close-sheet-btn" aria-label="Close sheet">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="hero-price-container">
        <div class="sheet-hero-price-4x">
          $<span id="hero-price">139</span><span class="cents">.00</span>
          <span class="tax-badge-centered">Tax</span>
        </div>
      </div>

      <div class="pill-selector">
        <button class="pill-btn active" data-price="139" data-photos="25">
          <div class="count">25</div>
          <div class="price">$139</div>
        </button>
        <button class="pill-btn" data-price="179" data-photos="36">
          <div class="count">36</div>
          <div class="price">$179</div>
        </button>
        <button class="pill-btn" data-price="189" data-photos="40">
          <div class="count">40</div>
          <div class="price">$189</div>
        </button>
        <button class="pill-btn" data-price="224" data-photos="50">
          <div class="count">50</div>
          <div class="price">$224</div>
        </button>
      </div>

      <div class="line-item-card">
        <div class="line-row">
          <span id="base-package-label">Base 25 Photos</span>
          <span id="base-price-display">$139</span>
        </div>
        <div class="line-row sub" id="extra-images-row">
          <span>Extra Images ($5/ea)</span>
          <span id="extra-price-display">$0</span>
        </div>
      </div>

      <div class="stepper-row">
        <span style="font-size: 13px; font-weight: 800; color: var(--text-primary);">Total Photos</span>
        <div class="stepper-controls">
          <button class="step-btn" id="step-minus" aria-label="Decrease photo count">-</button>
          <span class="step-value" id="photo-count">25</span>
          <button class="step-btn" id="step-plus" aria-label="Increase photo count">+</button>
        </div>
      </div>

      <button class="cta-button-icon" id="add-to-cart-btn">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      </button>

    </div>

    <!-- FLOATING PILL BOTTOM NAVIGATION -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" id="bnav-1" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="nav-item" id="bnav-2" aria-label="Categories">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <button class="nav-item" id="bnav-3" aria-label="Video Services">
        <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button class="nav-item" id="bnav-4" aria-label="Addons">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </button>
    </nav>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const body = document.body;
      const themeToggle = document.getElementById('theme-toggle');
      const screen1 = document.getElementById('screen-1');
      const screen2 = document.getElementById('screen-2');
      const bnav1 = document.getElementById('bnav-1');
      const bnav2 = document.getElementById('bnav-2');
      const backTo1 = document.getElementById('back-to-1');
      const logoBtn = document.getElementById('logo-btn');
      const bottomNav = document.getElementById('bottom-nav');
      const s2HeaderTitle = document.getElementById('s2-header-title');
      const s2HeaderIcon = document.getElementById('s2-header-icon');
      const splashScreen = document.getElementById('splash-screen');

      // SPLASH TIMING LOGIC
      function runSplashAnimation() {
        splashScreen.classList.remove('hide');
        setTimeout(() => {
          splashScreen.classList.add('hide');
        }, 1200);
      }

      // Initial Launch Splash
      runSplashAnimation();

      function triggerHaptic(ms = 12) {
        if ('vibrate' in navigator) {
          try { navigator.vibrate(ms); } catch(e){}
        }
      }

      document.querySelectorAll('button, .tile').forEach(el => {
        el.addEventListener('pointerdown', () => triggerHaptic(10));
      });

      themeToggle.addEventListener('click', () => {
        triggerHaptic(18);
        const isDark = body.getAttribute('data-theme') === 'dark';
        body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      });

      function goToScreen(num) {
        triggerHaptic(15);
        if (num === 1) {
          screen1.classList.add('active'); screen2.classList.remove('active');
          bnav1.classList.add('active'); bnav2.classList.remove('active');
        } else if (num === 2) {
          screen1.classList.remove('active'); screen2.classList.add('active');
          bnav1.classList.remove('active'); bnav2.classList.add('active');
        }
      }

      bnav1.addEventListener('click', () => goToScreen(1));
      bnav2.addEventListener('click', () => goToScreen(2));
      backTo1.addEventListener('click', () => goToScreen(1));
      
      // Re-trigger splash when clicking top logo button
      logoBtn.addEventListener('click', () => {
        goToScreen(1);
        runSplashAnimation();
      });

      const homeTiles = document.querySelectorAll('#home-grid .tile');
      homeTiles.forEach(tile => {
        tile.addEventListener('click', () => {
          triggerHaptic(18);
          const label = tile.getAttribute('data-label');
          const iconSvg = tile.querySelector('.icon-well svg').outerHTML;
          s2HeaderTitle.textContent = label;
          s2HeaderIcon.outerHTML = iconSvg;
          goToScreen(2);
        });
      });

      // BOTTOM SHEET ENGINE
      const openSheetBtn = document.getElementById('open-full-shoot');
      const closeSheetBtn = document.getElementById('close-sheet-btn');
      const sheetOverlay = document.getElementById('sheet-overlay');
      const bottomSheet = document.getElementById('bottom-sheet');
      const handleBar = document.getElementById('sheet-handle-bar');

      let startY = 0;
      let sheetHeight = 0;
      let isDragging = false;
      let lastTime = 0;
      let lastY = 0;
      let velocity = 0;

      function openSheet() {
        triggerHaptic(22);
        sheetHeight = bottomSheet.offsetHeight;
        bottomSheet.classList.add('animate-snap', 'expanded');
        sheetOverlay.classList.add('active');
        bottomSheet.style.transform = 'translateY(0px)';
        bottomNav.classList.add('nav-hidden');
      }

      function closeSheet() {
        triggerHaptic(15);
        bottomSheet.classList.add('animate-snap');
        bottomSheet.classList.remove('expanded');
        sheetOverlay.classList.remove('active');
        bottomSheet.style.transform = 'translateY(100%)';
        bottomNav.classList.remove('nav-hidden');
      }

      openSheetBtn.addEventListener('click', openSheet);
      closeSheetBtn.addEventListener('click', closeSheet);
      sheetOverlay.addEventListener('click', closeSheet);

      function onPointerDown(e) {
        isDragging = true;
        startY = e.clientY || e.touches[0].clientY;
        lastY = startY;
        lastTime = performance.now();
        velocity = 0;
        bottomSheet.classList.remove('animate-snap');
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const pointerY = e.clientY || (e.touches && e.touches[0].clientY);
        const deltaY = pointerY - startY;
        const now = performance.now();
        const dt = now - lastTime;
        
        if (dt > 0) {
          velocity = (pointerY - lastY) / dt;
          lastTime = now;
          lastY = pointerY;
        }

        if (deltaY < 0) {
          const resistantY = -Math.pow(Math.abs(deltaY), 0.72);
          bottomSheet.style.transform = `translateY(${resistantY}px)`;
        } else {
          bottomSheet.style.transform = `translateY(${deltaY}px)`;
        }
      }

      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        bottomSheet.classList.add('animate-snap');

        const currentTransformY = parseInt(bottomSheet.style.transform.replace(/[^0-9-]/g, '')) || 0;

        if (velocity > 0.45 || currentTransformY > sheetHeight * 0.35) {
          closeSheet();
        } else {
          bottomSheet.style.transform = 'translateY(0px)';
        }
      }

      handleBar.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      handleBar.addEventListener('touchstart', onPointerDown, { passive: true });
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', onPointerUp);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && bottomSheet.classList.contains('expanded')) {
          closeSheet();
        }
      });

      // PRICING ENGINE LOGIC
      const heroPrice = document.getElementById('hero-price');
      const photoCount = document.getElementById('photo-count');
      const basePackageLabel = document.getElementById('base-package-label');
      const basePriceDisplay = document.getElementById('base-price-display');
      const extraPriceDisplay = document.getElementById('extra-price-display');
      const extraImagesRow = document.getElementById('extra-images-row');
      const pillBtns = document.querySelectorAll('.pill-btn');
      
      let basePhotos = 25;
      let basePrice = 139;
      let currentPhotos = 25;

      function updatePricing() {
        const extraPhotos = Math.max(0, currentPhotos - basePhotos);
        const extraCost = extraPhotos * 5;
        const totalCost = basePrice + extraCost;

        heroPrice.textContent = totalCost;
        photoCount.textContent = currentPhotos;
        basePackageLabel.textContent = `Base ${basePhotos} Photos`;
        basePriceDisplay.textContent = `$${basePrice}`;
        extraPriceDisplay.textContent = `$${extraCost}`;

        if (extraCost > 0) {
          extraImagesRow.classList.add('active-extra');
        } else {
          extraImagesRow.classList.remove('active-extra');
        }
      }

      pillBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          triggerHaptic(14);
          pillBtns.forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          basePrice = parseInt(btn.dataset.price);
          basePhotos = parseInt(btn.dataset.photos);
          currentPhotos = basePhotos;
          updatePricing();
        });
      });

      document.getElementById('step-minus').addEventListener('click', () => {
        triggerHaptic(10);
        if (currentPhotos > 15) {
          currentPhotos -= 1;
          updatePricing();
        }
      });

      document.getElementById('step-plus').addEventListener('click', () => {
        triggerHaptic(10);
        currentPhotos += 1;
        updatePricing();
      });

      // TOAST SYSTEM
      const toastContainer = document.getElementById('toast-container');
      function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        toastContainer.appendChild(toast);
        
        requestAnimationFrame(() => toast.classList.add('show'));
        
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 400);
        }, 2200);
      }

      document.getElementById('add-to-cart-btn').addEventListener('click', () => {
        triggerHaptic(25);
        closeSheet();
        showToast('Added to Quote!');
      });
    });
  </script>
</body>
</html>
