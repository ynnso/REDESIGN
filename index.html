<!DOCTYPE html>
<html lang="en" x-data="{ isDark: true, activeSheet: null }" :class="isDark ? 'dark' : ''">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S2S Field App - Elite UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    /* CORE ARCHITECTURE & PHYSICS */
    :root {
      --spring-snappy: cubic-bezier(0.34, 1.56, 0.64, 1);
      --curve-smooth: cubic-bezier(0.25, 1, 0.5, 1);
    }
    
    html, body { 
      overscroll-behavior-y: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    /* Hide scrollbars for slick mobile view */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* HIGH-CONTRAST NEUMORPHIC UTILITIES */
    .dark .neo-raise { 
      box-shadow: 8px 8px 16px #090909, -8px -8px 16px #1b1b1b; 
      background: #121212; 
    }
    .dark .neo-inset { 
      box-shadow: inset 6px 6px 12px #090909, inset -6px -6px 12px #1b1b1b; 
      background: #121212; 
    }
    .dark .neo-active:active { 
      box-shadow: inset 4px 4px 8px #090909, inset -4px -4px 8px #1b1b1b; 
    }
    
    .neo-raise { 
      box-shadow: 8px 8px 16px #d1d5db, -8px -8px 16px #ffffff; 
      background: #f5f5f5; 
    }
    .neo-inset { 
      box-shadow: inset 6px 6px 12px #d1d5db, inset -6px -6px 12px #ffffff; 
      background: #f5f5f5; 
    }
    .neo-active:active { 
      box-shadow: inset 4px 4px 8px #d1d5db, inset -4px -4px 8px #ffffff; 
    }

    /* SHEET PHYSICS */
    .sheet-transition { 
      transition: transform 0.35s var(--spring-snappy), opacity 0.25s ease-out; 
    }
  </style>
</head>
<body class="w-full min-h-screen transition-colors duration-300 dark:bg-[#121212] bg-[#f5f5f5] dark:text-white text-neutral-900 font-sans flex flex-col justify-between"
      x-data="appData()">

  <!-- HEADER NAV -->
  <header class="px-6 pt-8 pb-4 grid grid-cols-3 items-center z-30 w-full max-w-md mx-auto">
    <!-- Logo -->
    <div class="justify-self-start flex items-center justify-center w-12 h-12 rounded-xl neo-raise neo-active cursor-pointer">
      <span class="font-bold text-lg">S<span class="text-red-500 font-black">2</span>S</span>
    </div>
    
    <!-- Theme Toggle -->
    <div class="justify-self-center">
      <button @click="isDark = !isDark" class="w-12 h-12 rounded-full flex items-center justify-center neo-raise neo-active focus:outline-none">
        <svg x-show="isDark" class="w-6 h-6 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m0 13.5V21m8.966-8.966h-2.25m-13.5 0H3m15.364-6.364l-1.591 1.591M6.758 17.242l-1.591 1.591m12.728 0l-1.591-1.591M6.758 6.758L5.167 5.167M12 8.25a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z" />
        </svg>
        <svg x-show="!isDark" class="w-6 h-6 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: none;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
      </button>
    </div>

    <!-- Cart Badge -->
    <div class="justify-self-end">
      <button class="w-12 h-12 rounded-full flex items-center justify-center neo-raise neo-active relative focus:outline-none">
        <svg class="w-6 h-6" viewBox="0 0 24 24" stroke-width="1.8" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17"/>
        </svg>
        <div class="absolute -top-1 -right-1 bg-red-600 text-white text-xs font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">1</div>
      </button>
    </div>
  </header>

  <!-- HOME SCREEN: CENTRALLY ALIGNED GRID -->
  <main class="flex-1 flex flex-col justify-center px-6 pb-24 w-full max-w-md mx-auto">
    <div class="grid grid-cols-2 gap-5 place-items-center">
      <template x-for="item in ['Photos', 'Video', 'Aerial', '360 Tour', 'Floor Plan', 'Add-Ons']">
        <button @click="if(item === 'Photos') activeSheet = 'photosScreen'" class="w-full aspect-square rounded-3xl flex flex-col items-center justify-center gap-3 neo-raise neo-active transition-transform active:scale-95">
          <div class="w-12 h-12 rounded-2xl neo-inset flex items-center justify-center">
             <div class="w-5 h-5 bg-current rounded-sm opacity-70"></div>
          </div>
          <span class="font-bold tracking-wide text-xs uppercase" x-text="item"></span>
        </button>
      </template>
    </div>
  </main>

  <!-- PERSISTENT BOTTOM BAR -->
  <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-sm h-16 rounded-2xl neo-raise z-40 flex items-center justify-around px-4">
    <button class="p-3 neo-active rounded-xl text-red-500"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2l8 8h-3v8H5v-8H2l8-8z"/></svg></button>
    <button class="p-3 neo-active rounded-xl"><svg class="w-6 h-6 opacity-60 hover:opacity-100" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3h12a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1zm1 2v10h10V5H5z"/></svg></button>
    <button class="p-3 neo-active rounded-xl"><svg class="w-6 h-6 opacity-60 hover:opacity-100" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg></button>
  </nav>

  <!-- BOTTOM SHEET 1: PHOTOS OVERVIEW SCREEN -->
  <div x-show="activeSheet === 'photosScreen'" 
       x-transition:enter="sheet-transition" 
       x-transition:enter-start="translate-y-full opacity-0" 
       x-transition:enter-end="translate-y-0 opacity-100" 
       x-transition:leave="sheet-transition" 
       x-transition:leave-start="translate-y-0 opacity-100" 
       x-transition:leave-end="translate-y-full opacity-0"
       class="fixed inset-0 z-50 flex flex-col justify-end" style="display: none;">
    
    <!-- BACKDROP -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="activeSheet = null"></div>

    <!-- SHEET CONTAINER -->
    <div class="relative w-full max-w-md mx-auto h-[80vh] neo-raise rounded-t-[2.5rem] p-6 flex flex-col justify-between">
      <div>
        <div class="w-12 h-1.5 bg-neutral-400/40 rounded-full mx-auto mb-6 neo-inset cursor-pointer" @click="activeSheet = null"></div>
        
        <h2 class="text-2xl font-black tracking-tight mb-6 text-center">Select Photo Package</h2>
        
        <div class="space-y-6 overflow-y-auto no-scrollbar max-h-[55vh] pr-1">
          <!-- MLS CONTAINER -->
          <div class="p-5 neo-raise rounded-2xl">
            <h3 class="text-xs font-black uppercase tracking-widest opacity-50 mb-4">MLS Standard Services</h3>
            <div class="grid grid-cols-2 gap-4">
              <button @click="activeSheet = 'mlsFullShoot'" class="p-4 neo-inset rounded-xl flex flex-col items-center text-center neo-active transition-transform active:scale-95">
                <span class="font-bold text-sm">Full Shoot</span>
                <span class="text-xs mt-1 text-red-500 font-black">From $139</span>
              </button>
              <button class="p-4 neo-inset rounded-xl flex flex-col items-center text-center neo-active transition-transform active:scale-95 opacity-60">
                <span class="font-bold text-sm">Mini Shoot</span>
                <span class="text-xs mt-1 text-red-500 font-black">From $119</span>
              </button>
            </div>
          </div>

          <!-- AIRBNB CONTAINER -->
          <div class="p-5 neo-raise rounded-2xl">
            <h3 class="text-xs font-black uppercase tracking-widest opacity-50 mb-4">Short-Term Rentals</h3>
            <button class="w-full p-4 neo-inset rounded-xl flex justify-between items-center neo-active transition-transform active:scale-95 opacity-60">
              <span class="font-bold text-sm">Airbnb / VRBO Special</span>
              <span class="text-red-500 font-black text-sm">From $169</span>
            </button>
          </div>
        </div>
      </div>

      <button @click="activeSheet = null" class="w-full py-4 rounded-xl neo-raise neo-active text-xs font-bold uppercase tracking-wider opacity-70">
        Back to Dashboard
      </button>
    </div>
  </div>

  <!-- BOTTOM SHEET 2: FULL SHOOT CONFIGURATOR -->
  <div x-show="activeSheet === 'mlsFullShoot'" 
       x-transition:enter="sheet-transition" 
       x-transition:enter-start="translate-y-full opacity-0" 
       x-transition:enter-end="translate-y-0 opacity-100" 
       x-transition:leave="sheet-transition" 
       x-transition:leave-start="translate-y-0 opacity-100" 
       x-transition:leave-end="translate-y-full opacity-0"
       class="fixed inset-0 z-50 flex flex-col justify-end" style="display: none;">
    
    <!-- BACKDROP -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="activeSheet = 'photosScreen'"></div>

    <!-- SHEET CONTAINER -->
    <div class="relative w-full max-w-md mx-auto h-[90vh] neo-raise rounded-t-[2.5rem] p-6 flex flex-col justify-between">
      <div>
        <div class="w-12 h-1.5 bg-neutral-400/40 rounded-full mx-auto mb-4 neo-inset cursor-pointer" @click="activeSheet = 'photosScreen'"></div>
        
        <!-- HERO HEADER & PRICING -->
        <div class="neo-raise p-5 rounded-2xl flex justify-between items-center mb-6">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 neo-inset rounded-xl flex items-center justify-center text-red-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            </div>
            <div>
              <h2 class="text-lg font-black leading-tight">Full Shoot</h2>
              <p class="text-[10px] font-black opacity-50 tracking-wider">MLS PACKAGE</p>
            </div>
          </div>

          <!-- DYNAMIC PRICE TAG -->
          <div class="neo-inset px-3 py-1.5 rounded-xl flex items-start">
            <span class="text-sm font-bold mt-1 opacity-60">$</span>
            <span class="text-3xl font-black tabular-nums tracking-tighter" x-text="fullShootPrice">139</span>
            <div class="flex flex-col items-start ml-1 mt-1">
              <span class="text-[8px] font-black text-red-500 tracking-wider leading-none mb-0.5">EST</span>
              <span class="text-xs font-bold opacity-60 leading-none">.00</span>
            </div>
          </div>
        </div>

        <!-- SLIDER CONTAINER -->
        <div class="p-6 neo-raise rounded-2xl">
          <div class="flex justify-between items-center mb-6">
            <h3 class="font-bold text-sm tracking-wide">Image Quantity</h3>
            <div class="px-3 py-1 neo-inset rounded-lg font-black text-xs text-red-500" x-text="photoCount + ' Photos'"></div>
          </div>
          
          <!-- TACTILE SLIDER -->
          <div class="relative w-full h-4 neo-inset rounded-full flex items-center my-4">
            <input type="range" min="25" max="150" step="5" x-model.number="photoCount" class="absolute w-full h-full opacity-0 z-20 cursor-pointer">
            
            <!-- Track Fill -->
            <div class="absolute left-0 h-full bg-red-600 rounded-full z-10" :style="'width: ' + ((photoCount - 25) / 125 * 100) + '%'"></div>
            
            <!-- Custom Handle -->
            <div class="absolute w-7 h-7 rounded-full bg-[#f5f5f5] dark:bg-[#121212] z-10 flex items-center justify-center neo-raise transition-all duration-75 pointer-events-none" 
                 :style="'left: calc(' + ((photoCount - 25) / 125 * 100) + '% - 14px)'">
                 <div class="w-2.5 h-2.5 rounded-full bg-red-500 neo-inset"></div>
            </div>
          </div>
          
          <div class="flex justify-between text-[10px] font-bold opacity-40 px-1 mt-2">
            <span>25 (Standard)</span>
            <span>150 (Max)</span>
          </div>
        </div>
      </div>

      <!-- FOOTER ACTIONS -->
      <div class="space-y-3">
        <button @click="activeSheet = null" class="w-full py-4 rounded-2xl bg-red-600 text-white font-black text-base tracking-wide shadow-lg shadow-red-600/30 active:scale-95 transition-transform">
          Save Configuration
        </button>
        <button @click="activeSheet = 'photosScreen'" class="w-full py-3 rounded-xl neo-raise neo-active text-xs font-bold uppercase tracking-wider opacity-70">
          Back
        </button>
      </div>

    </div>
  </div>

  <script>
    function appData() {
      return {
        isDark: true,
        activeSheet: null,
        photoCount: 25,
        basePrice: 139,
        get fullShootPrice() {
          return this.basePrice + (Math.max(0, this.photoCount - 25) * 2);
        }
      }
    }
  </script>
</body>
</html>
