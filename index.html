<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Concept 10 — Neumorphic</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#e4e9f0; }
  body {
    font-family: -apple-system, sans-serif;
    max-width: 430px; margin:0 auto; height:100vh; color:#3a4556;
  }
  header { padding: 22px 20px 10px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .brand { font-weight:800; font-size:16px; color:#5a6b8c; }
  .cart-btn {
    background:#e4e9f0; padding:10px 16px; border-radius:14px; font-size:12px; font-weight:700; color:#5a6b8c;
    box-shadow: 5px 5px 10px #c3c9d4, -5px -5px 10px #ffffff;
  }
  h1 { font-size: 24px; font-weight: 700; margin:0; letter-spacing:-0.01em; color:#2d3648; }
  .grid { padding: 12px 18px 100px; display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card {
    background: #e4e9f0;
    border-radius: 22px;
    padding: 20px;
    aspect-ratio: 1;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 8px 8px 16px #c3c9d4, -8px -8px 16px #ffffff;
    transition: box-shadow .15s, transform .15s;
  }
  .card:active {
    box-shadow: inset 5px 5px 10px #c3c9d4, inset -5px -5px 10px #ffffff;
  }
  .icon-well {
    width:46px; height:46px; border-radius:14px;
    background:#e4e9f0;
    box-shadow: inset 4px 4px 8px #c3c9d4, inset -4px -4px 8px #ffffff;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-well svg { width:24px; height:24px; }
  .label { font-size: 16px; font-weight: 700; color:#2d3648; }
  .count { font-size: 11px; color: #8a94a8; font-weight:600; margin-top:1px; }
  .accent { color:#FF6B5E; }
</style>
</head>
