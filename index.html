<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>s2s — Neumorphic x Current Style Test</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{ font-family:-apple-system,sans-serif; max-width:430px; margin:0 auto; height:100vh; position:relative; transition:background .3s, color .3s; }

  body.dark{ background:#0d0d0d; color:#fff; }
  body.light{ background:#f0f0f0; color:#1a1a1a; }

  .mode-toggle{ position:absolute; top:16px; left:20px; z-index:200; display:flex; background:rgba(128,128,128,0.2); border-radius:100px; padding:3px; backdrop-filter:blur(10px); }
  .mode-toggle button{ padding:6px 12px; border:none; background:transparent; font-size:11px; font-weight:700; border-radius:100px; font-family:inherit; color:inherit; opacity:0.5; }
  .mode-toggle button.active{ background:#E50914; color:#fff; opacity:1; }

  /* ===== TOP NAV ===== */
  header{ padding:16px 20px 10px; display:flex; justify-content:space-between; align-items:center; }
  .brand{ font-weight:800; font-size:16px; }
  .brand .accent{ color:#E50914; }
  .cart-btn{ width:38px; height:38px; border-radius:100px; display:flex; align-items:center; justify-content:center; position:relative; }
  body.dark .cart-btn{ background:#0d0d0d; box-shadow:5px 5px 10px #060606, -5px -5px 10px #141414; }
  body.light .cart-btn{ background:#f0f0f0; box-shadow:5px 5px 10px #d1d1d1, -5px -5px 10px #ffffff; }
  .cart-btn svg{ width:17px; height:17px; }
  body.dark .cart-btn svg{ stroke:#fff; }
  body.light .cart-btn svg{ stroke:#1a1a1a; }
  .badge{ position:absolute; top:-2px; right:-2px; background:#E50914; color:#fff; font-size:9px; font-weight:800; width:15px; height:15px; border-radius:100px; display:flex; align-items:center; justify-content:center; }

  /* ===== HOME SCREEN ===== */
  #home{ padding-top:0; height:100%; display:flex; flex-direction:column; justify-content:center; }
  .grid{ padding:8px 24px 90px; display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .tile{ aspect-ratio:1; border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:10px; }
  body.dark .tile{ background:#0d0d0d; box-shadow:9px 9px 18px #060606, -9px -9px 18px #141414; }
  body.light .tile{ background:#f0f0f0; box-shadow:9px 9px 18px #d1d1d1, -9px -9px 18px #ffffff; }
  .icon-well{ width:94px; height:94px; border-radius:24px; display:flex; align-items:center; justify-content:center; }
  body.dark .icon-well{ background:#0d0d0d; box-shadow:inset 4px 4px 8px #060606, inset -4px -4px 8px #141414; }
  body.light .icon-well{ background:#f0f0f0; box-shadow:inset 4px 4px 8px #d1d1d1, inset -4px -4px 8px #ffffff; }
  .tile svg{ width:72px; height:72px; color:#E50914; }
  body.dark .tile svg{ color:#fff; }
  .tile .name{ font-size:19px; font-weight:800; letter-spacing:-0.01em; text-align:center; }

  /* ===== BOTTOM NAV ===== */
  .bottom-nav{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); width:88%; max-width:360px; height:58px; border-radius:100px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; z-index:20; }
  body.dark .bottom-nav{ background:#0d0d0d; box-shadow:8px 8px 16px #060606, -8px -8px 16px #141414; }
  body.light .bottom-nav{ background:#f0f0f0; box-shadow:8px 8px 16px #d1d1d1, -8px -8px 16px #ffffff; }
  .nav-icon{ width:22px; height:22px; opacity:0.5; }
  .nav-icon.active{ opacity:1; color:#E50914; }
  body.dark .nav-icon{ stroke:#fff; }
  body.light .nav-icon{ stroke:#1a1a1a; }
  .nav-icon.active{ stroke:#E50914; }

  /* ===== SHEET ===== */
  #sheetScreen{ display:none; position:absolute; inset:0; z-index:100; }
  #sheetScreen.active{ display:block; }
  .sheet{ position:absolute; left:0; right:0; bottom:0; top:0; border-radius:0; padding:16px 20px 24px; overflow-y:auto; z-index:100; }
  body.dark .sheet{ background:#0d0d0d; }
  body.light .sheet{ background:#f0f0f0; }
  .handle{ width:36px; height:5px; border-radius:100px; margin:0 auto 18px; }
  body.dark .handle{ background:#2a2a2a; }
  body.light .handle{ background:#d5d5d5; }
  .sheet-header{ display:flex; align-items:center; gap:14px; margin:36px 0 20px; }
  .sheet-icon{ width:70px; height:70px; border-radius:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  body.dark .sheet-icon{ background:#0d0d0d; box-shadow:inset 5px 5px 10px #060606, inset -5px -5px 10px #141414; }
  body.light .sheet-icon{ background:#f0f0f0; box-shadow:inset 5px 5px 10px #d1d1d1, inset -5px -5px 10px #ffffff; }
  .sheet-icon svg{ width:34px; height:34px; }
  .sheet-eyebrow{ font-size:14px; font-weight:700; opacity:0.55; }
  .sheet-title{ font-size:30px; font-weight:800; letter-spacing:-0.01em; }
  .price-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; }
  .price{ font-size:64px; font-weight:800; letter-spacing:-0.03em; color:#E50914; display:flex; align-items:baseline; }
  .price .cents{ font-size:26px; }
  .price .dollar{ font-size:26px; margin-right:2px; }
  .tax-chip{ font-size:11px; font-weight:700; padding:6px 11px; border-radius:10px; opacity:0.6; }
  body.dark .tax-chip{ background:#0d0d0d; box-shadow:4px 4px 8px #060606, -4px -4px 8px #141414; }
  body.light .tax-chip{ background:#f0f0f0; box-shadow:4px 4px 8px #d1d1d1, -4px -4px 8px #ffffff; }
  .dropdown{ border-radius:18px; padding:16px 18px; text-align:center; font-weight:700; font-size:18px; margin-bottom:18px; }
  body.dark .dropdown{ background:#0d0d0d; box-shadow:inset 5px 5px 10px #060606, inset -5px -5px 10px #141414; }
  body.light .dropdown{ background:#f0f0f0; box-shadow:inset 5px 5px 10px #d1d1d1, inset -5px -5px 10px #ffffff; }
  .tier-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
  .tier{ border-radius:18px; padding:14px 4px; text-align:center; }
  body.dark .tier{ background:#0d0d0d; box-shadow:6px 6px 12px #060606, -6px -6px 12px #141414; }
  body.light .tier{ background:#f0f0f0; box-shadow:6px 6px 12px #d1d1d1, -6px -6px 12px #ffffff; }
  .tier.sel{ color:#E50914; }
  body.dark .tier.sel{ box-shadow:inset 5px 5px 10px #060606, inset -5px -5px 10px #141414; }
  body.light .tier.sel{ box-shadow:inset 5px 5px 10px #d1d1d1, inset -5px -5px 10px #ffffff; }
  .tier .n{ font-size:17px; font-weight:800; }
  .tier .p{ font-size:13px; opacity:0.6; margin-top:2px; }
  .rows{ border-radius:18px; overflow:hidden; margin-bottom:18px; }
  body.dark .rows{ background:#0d0d0d; box-shadow:inset 5px 5px 10px #060606, inset -5px -5px 10px #141414; }
  body.light .rows{ background:#f0f0f0; box-shadow:inset 5px 5px 10px #d1d1d1, inset -5px -5px 10px #ffffff; }
  .row{ display:flex; justify-content:space-between; padding:15px 18px; font-size:16px; font-weight:600; }
  body.dark .row{ border-bottom:1px solid rgba(255,255,255,0.05); }
  body.light .row{ border-bottom:1px solid rgba(0,0,0,0.05); }
  .row:last-child{ border:none; }
  .stepper-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .stepper-label{ font-size:18px; font-weight:700; }
  .stepper{ display:flex; align-items:center; gap:14px; border-radius:16px; padding:8px 16px; }
  body.dark .stepper{ background:#0d0d0d; box-shadow:6px 6px 12px #060606, -6px -6px 12px #141414; }
  body.light .stepper{ background:#f0f0f0; box-shadow:6px 6px 12px #d1d1d1, -6px -6px 12px #ffffff; }
  .stepper button{ width:30px; height:30px; border-radius:10px; border:none; font-weight:700; font-size:16px; background:transparent; color:inherit; }
  .stepper .val{ font-size:18px; font-weight:800; color:#E50914; width:26px; text-align:center; }
  .cta{ width:100%; border:none; border-radius:20px; height:60px; font-size:18px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:10px; }
  body.dark .cta{ background:#0d0d0d; color:#fff; box-shadow:8px 8px 16px #060606, -8px -8px 16px #141414; }
  body.light .cta{ background:#f0f0f0; color:#1a1a1a; box-shadow:8px 8px 16px #d1d1d1, -8px -8px 16px #ffffff; }
  .back-btn{ position:absolute; top:16px; right:20px; z-index:5; width:38px; height:38px; border-radius:100px; display:flex; align-items:center; justify-content:center; }
  body.dark .back-btn{ background:#0d0d0d; box-shadow:5px 5px 10px #060606, -5px -5px 10px #141414; }
  body.light .back-btn{ background:#f0f0f0; box-shadow:5px 5px 10px #d1d1d1, -5px -5px 10px #ffffff; }
</style>

<script>
  function setMode(mode, btn){
    document.body.className = mode;
    document.querySelectorAll('.mode-toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  function openSheet(){
    document.getElementById('sheetScreen').classList.add('active');
    document.getElementById('home').style.display = 'none';
  }
  function closeSheet(){
    document.getElementById('sheetScreen').classList.remove('active');
    document.getElementById('home').style.display = 'flex';
  }
</script>
</body>
