<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Utility - 30 Bottom Sheet Layout Concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-app: #090a0f;
      --surface-sheet: #12141c;
      --surface-card: #1c1f2e;
      --surface-inset: #0d0f17;
      --border-color: #2e344a;
      --text-main: #ffffff;
      --text-muted: #8e99b7;
      --accent-red: #ff2a4b;
      --accent-red-hover: #e01b3c;
      --accent-glow: rgba(255, 42, 75, 0.25);
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Red Hat Display', sans-serif;
    }

    [data-theme="light"] {
      --bg-app: #e2e8f0;
      --surface-sheet: #ffffff;
      --surface-card: #f1f5f9;
      --surface-inset: #e2e8f0;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-red: #e11d48;
      --accent-red-hover: #be123c;
      --accent-glow: rgba(225, 29, 72, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: var(--font-main);
      background-color: var(--bg-app);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.25s ease;
    }

    /* Pinned Navigation Bar */
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(18, 20, 28, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    [data-theme="light"] .nav-bar {
      background: rgba(255, 255, 255, 0.85);
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      min-width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--surface-card);
      color: var(--text-main);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .nav-btn:active { transform: scale(0.95); }

    .concept-select {
      height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--surface-card);
      color: var(--text-main);
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      outline: none;
      max-width: 260px;
    }

    .theme-toggle-btn {
      height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--surface-card);
      color: var(--text-main);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Device Frame Simulation */
    .app-viewport {
      margin-top: 84px;
      margin-bottom: 40px;
      width: 100%;
      max-width: 430px;
      height: 880px;
      background: var(--surface-sheet);
      border: 8px solid #1e2330;
      border-radius: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
    }
    [data-theme="light"] .app-viewport {
      border-color: #cbd5e1;
    }

    .app-screen-content {
      flex: 1;
      padding: 24px;
      background: radial-gradient(circle at top right, rgba(255,42,75,0.08), transparent 50%);
      display: flex;
      flex-direction: column;
      opacity: 0.5;
      pointer-events: none;
    }
    .mock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .mock-badge {
      background: var(--surface-card);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border-color);
    }
    .mock-map {
      width: 100%;
      height: 200px;
      border-radius: 20px;
      background: var(--surface-inset);
      border: 1px dashed var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Container for Sheets */
    .sheet-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      top: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Base Sheet Container */
    .sheet {
      pointer-events: auto;
      background: var(--surface-sheet);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border: 1px solid var(--border-color);
      border-bottom: none;
      padding: 20px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
      display: none;
      flex-direction: column;
      gap: 16px;
      max-height: 90%;
      overflow-y: auto;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sheet.active { display: flex; }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Universal Sheet Components */
    .sheet-handle {
      width: 40px;
      height: 5px;
      background: var(--border-color);
      border-radius: 10px;
      align-self: center;
      margin-bottom: 8px;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }
    .hero-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hero-price {
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1;
    }
    .hero-price span {
      font-size: 20px;
      color: var(--accent-red);
    }

    .primary-btn {
      min-height: 56px;
      background: var(--accent-red);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-family: var(--font-main);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 20px var(--accent-glow);
      transition: all 0.15s ease;
      width: 100%;
    }
    .primary-btn:active { transform: scale(0.98); background: var(--accent-red-hover); }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      cursor: pointer;
    }
    .option-row.selected {
      border-color: var(--accent-red);
      background: rgba(255, 42, 75, 0.05);
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--surface-inset);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* CSS Specifics for Specific Archetypes */

    /* Variant 1: Floating Modular */
    .sheet[data-variant="1"] {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 16px;
    }
    .sheet[data-variant="1"] .mod-card {
      background: var(--surface-sheet);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 12px;
    }

    /* Variant 6: Horizontal Carousel */
    .carousel-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
    }
    .carousel-item {
      flex: 0 0 140px;
      scroll-snap-align: start;
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }
    .carousel-item.active {
      border-color: var(--accent-red);
      background: var(--accent-red);
      color: #fff;
    }

    /* Variant 8: 2x2 Grid */
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .grid-tile {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .grid-tile.active {
      background: var(--accent-red);
      color: white;
      border-color: var(--accent-red);
    }

    /* Variant 9: Neo Brutalist */
    .sheet[data-variant="9"] {
      border: 4px solid var(--text-main) !important;
      border-radius: 0 !important;
      box-shadow: -8px -8px 0px var(--accent-red) !important;
      background: var(--surface-sheet);
    }
    .sheet[data-variant="9"] .primary-btn {
      border: 3px solid var(--text-main);
      border-radius: 0;
      box-shadow: 5px 5px 0px var(--text-main);
      background: var(--accent-red);
      color: #fff;
    }

    /* Variant 13: Asymmetric Bento */
    .bento-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      grid-template-rows: auto auto;
      gap: 12px;
    }
    .bento-cell {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px;
    }
    .bento-cell.hero {
      grid-row: span 2;
      background: linear-gradient(135deg, var(--surface-card), var(--surface-inset));
      border-color: var(--accent-red);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Variant 15: Tactile Glove Switchboard */
    .glove-toggle {
      min-height: 64px;
      background: var(--surface-card);
      border: 2px solid var(--border-color);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-weight: 800;
    }
    .glove-toggle.active {
      border-color: var(--accent-red);
      background: rgba(255, 42, 75, 0.15);
    }

    /* Variant 28: Top-Right Floating Total */
    .floating-total-badge {
      position: absolute;
      top: -24px;
      right: 20px;
      background: var(--accent-red);
      color: white;
      padding: 12px 20px;
      border-radius: 30px;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 10px 20px var(--accent-glow);
    }
  </style>
</head>
<body>

  <!-- Pinned Control Header -->
  <nav class="nav-bar">
    <div class="nav-left">
      <button class="nav-btn" id="prevBtn">←</button>
      <select class="concept-select" id="conceptSelect"></select>
      <button class="nav-btn" id="nextBtn">→</button>
    </div>
    <div class="nav-right">
      <button class="theme-toggle-btn" id="themeBtn">
        <span id="themeIcon">☀️</span>
        <span id="themeText">Light</span>
      </button>
    </div>
  </nav>

  <!-- Mobile Viewport Frame -->
  <div class="app-viewport">
    <div class="app-screen-content">
      <div class="mock-header">
        <span class="mock-badge">JOB #88492</span>
        <span class="mock-badge">CAM-A</span>
      </div>
      <div class="mock-map">
        [ Field Location GIS Overlay ]
      </div>
    </div>

    <!-- Container for the 30 Bottom Sheet Layout Concepts -->
    <div class="sheet-wrapper" id="sheetWrapper"></div>
  </div>

  <script>
    // Master Package Data
    const baseData = {
      title: "HD Highlight Video",
      category: "MLS Video Package",
      basePrice: 159.00,
      options: [
        { id: "tax", label: "State & Local Tax", price: 12.72, default: true },
        { id: "4k", label: "4K Master Export Upgrade", price: 45.00, default: false },
        { id: "drone", label: "Aerial Drone B-Roll Addon", price: 75.00, default: false },
        { id: "speed", label: "24-Hour Express Delivery", price: 30.00, default: false }
      ]
    };

    // Concept Names Array
    const concepts = [
      "1. Floating Modular Cards",
      "2. Accordion Stacks",
      "3. Segmented Multi-Tab Sheet",
      "4. Typography-First Minimalist",
      "5. Split-Screen Bottom Dock",
      "6. Horizontal Carousel Pill Picker",
      "7. Floating Action Capsule",
      "8. High-Contrast 2x2 Grid Tiles",
      "9. Neo-Brutalist High-Border",
      "10. Laboratory Clinical Matrix",
      "11. Full-Bleed Edge Cards",
      "12. Radial Speed Dial",
      "13. Asymmetric Bento Grid",
      "14. Pinned Top-Hero Canvas",
      "15. Tactile Glove Switchboard",
      "16. Bottom-Anchored Thumb Zone",
      "17. High-Contrast Gradient Canvas",
      "18. Split Dual-Shade Sheet",
      "19. Borderless Divider Grid",
      "20. Floating HUD Sheet",
      "21. Horizontal Snap Cards",
      "22. Icon-Anchored Row Strips",
      "23. Top-Heavy Price Banner",
      "24. Two-Column Switcher Grid",
      "25. Inset Well Matrix",
      "26. Overlapping Dynamic Pill Stack",
      "27. Clean Technical Spec",
      "28. Top-Right Floating Total Badge",
      "29. Full-Screen Sheet Overhaul",
      "30. Centered Focal Point"
    ];

    let currentConcept = 0;
    let selectedOptions = new Set(["tax"]);

    function calculateTotal() {
      let total = baseData.basePrice;
      baseData.options.forEach(opt => {
        if (selectedOptions.has(opt.id)) {
          total += opt.price;
        }
      });
      return total.toFixed(2);
    }

    function toggleOption(id) {
      if (selectedOptions.has(id)) {
        selectedOptions.delete(id);
      } else {
        selectedOptions.add(id);
      }
      renderAllSheets();
    }

    // Generator function for HTML structures across 30 concepts
    function generateSheetHTML(index) {
      const total = calculateTotal();
      const variant = index + 1;

      // Custom Layout Variations
      switch(variant) {
        case 1: // Floating Modular Cards
          return `
            <div class="sheet active" data-variant="1">
              <div class="mod-card">
                <div class="hero-subtitle">${baseData.category}</div>
                <div class="hero-title">${baseData.title}</div>
                <div class="hero-price" style="margin-top:10px;">$${total}</div>
              </div>
              <div class="mod-card" style="display:flex; flex-direction:column; gap:8px;">
                ${baseData.options.map(opt => `
                  <div class="option-row ${selectedOptions.has(opt.id) ? 'selected' : ''}" onclick="toggleOption('${opt.id}')">
                    <span>${opt.label}</span>
                    <b>+$${opt.price.toFixed(2)}</b>
                  </div>
                `).join('')}
              </div>
              <button class="primary-btn"><span>🛒</span> Confirm Adjustment</button>
            </div>`;

        case 6: // Carousel Pill Picker
          return `
            <div class="sheet active" data-variant="6">
              <div class="sheet-handle"></div>
              <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <div>
                  <div class="hero-subtitle">${baseData.category}</div>
                  <div class="hero-title">${baseData.title}</div>
                </div>
                <div class="hero-price">$${total}</div>
              </div>
              <div class="carousel-container">
                ${baseData.options.map(opt => `
                  <div class="carousel-item ${selectedOptions.has(opt.id) ? 'active' : ''}" onclick="toggleOption('${opt.id}')">
                    <div style="font-size:12px; opacity:0.8;">${opt.label}</div>
                    <div style="font-weight:800; font-size:16px; margin-top:6px;">+$${opt.price.toFixed(2)}</div>
                  </div>
                `).join('')}
              </div>
              <button class="primary-btn">Apply Modifiers</button>
            </div>`;

        case 8: // 2x2 Grid
          return `
            <div class="sheet active" data-variant="8">
              <div class="sheet-handle"></div>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="hero-title">${baseData.title}</div>
                <div class="hero-price">$${total}</div>
              </div>
              <div class="grid-2x2">
                ${baseData.options.map(opt => `
                  <div class="grid-tile ${selectedOptions.has(opt.id) ? 'active' : ''}" onclick="toggleOption('${opt.id}')">
                    <span style="font-size:12px; font-weight:700;">${opt.label}</span>
                    <span style="font-size:18px; font-weight:900;">+$${opt.price.toFixed(2)}</span>
                  </div>
                `).join('')}
              </div>
              <button class="primary-btn">Lock In Price</button>
            </div>`;

        case 9: // Neo Brutalist
          return `
            <div class="sheet active" data-variant="9">
              <div style="background:var(--text-main); color:var(--bg-app); padding:4px 8px; font-weight:900; display:inline-block; width:fit-content;">${baseData.category}</div>
              <div class="hero-title" style="font-size:28px;">${baseData.title}</div>
              <div class="hero-price" style="font-size:52px;">$${total}</div>
              <div style="display:flex; flex-direction:column; gap:8px;">
                ${baseData.options.map(opt => `
                  <div class="option-row" style="border:2px solid var(--text-main); border-radius:0;" onclick="toggleOption('${opt.id}')">
                    <span style="font-weight:800;">${selectedOptions.has(opt.id) ? '[X]' : '[ ]'} ${opt.label}</span>
                    <b>+$${opt.price.toFixed(2)}</b>
                  </div>
                `).join('')}
              </div>
              <button class="primary-btn">SUBMIT DISPATCH</button>
            </div>`;

        case 13: // Asymmetric Bento Grid
          return `
            <div class="sheet active" data-variant="13">
              <div class="sheet-handle"></div>
              <div class="bento-grid">
                <div class="bento-cell hero">
                  <div>
                    <div class="hero-subtitle">${baseData.category}</div>
                    <div class="hero-title">${baseData.title}</div>
                  </div>
                  <div class="hero-price">$${total}</div>
                </div>
                ${baseData.options.slice(0, 2).map(opt => `
                  <div class="bento-cell ${selectedOptions.has(opt.id) ? 'selected' : ''}" onclick="toggleOption('${opt.id}')" style="border-color:${selectedOptions.has(opt.id) ? 'var(--accent-red)' : ''}">
                    <div style="font-size:11px; color:var(--text-muted);">${opt.label}</div>
                    <div style="font-weight:800; margin-top:4px;">+$${opt.price}</div>
                  </div>
                `).join('')}
              </div>
              <button class="primary-btn">Save Quote</button>
            </div>`;

        case 15: // Tactile Glove Switchboard
          return `
            <div class="sheet active" data-variant="15">
              <div class="sheet-handle"></div>
              <div style="text-align:center;">
                <div class="hero-subtitle">GLOVE-TOUCH INTERFACE</div>
                <div class="hero-price" style="font-size:48px;">$${total}</div>
              </div>
              <div style="display:flex; flex-direction:column; gap:10px;">
                ${baseData.options.map(opt => `
                  <div class="glove-toggle ${selectedOptions.has(opt.id) ? 'active' : ''}" onclick="toggleOption('${opt.id}')">
                    <span>${opt.label}</span>
                    <span style="color:var(--accent-red);">+$${opt.price}</span>
                  </div>
                `).join('')}
              </div>
              <button class="primary-btn" style="min-height:64px; font-size:18px;">ACCEPT ADJUSTMENT</button>
            </div>`;

        case 28: // Top Right Floating Total Badge
          return `
            <div class="sheet active" data-variant="28" style="position:relative; overflow:visible;">
              <div class="floating-total-badge">$${total}</div>
              <div class="sheet-handle" style="margin-top:10px;"></div>
              <div class="hero-subtitle">${baseData.category}</div>
              <div class="hero-title">${baseData.title}</div>
              <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
                ${baseData.options.map(opt => `
                  <div class="option-row ${selectedOptions.has(opt.id) ? 'selected' : ''}" onclick="toggleOption('${opt.id}')">
                    <span>${opt.label}</span>
                    <b>+$${opt.price.toFixed(2)}</b>
                  </div>
                `).join('')}
              </div>
              <button class="primary-btn">Update Order</button>
            </div>`;

        default: // Standard Dynamic Structural Render for remaining variants
          return `
            <div class="sheet active" data-variant="${variant}">
              <div class="sheet-handle"></div>
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <div class="hero-subtitle">CONCEPT ${variant}</div>
                  <div class="hero-title">${baseData.title}</div>
                </div>
                <div class="hero-price">$${total}</div>
              </div>
              <div style="display:flex; flex-direction:column; gap:8px; margin:10px 0;">
                ${baseData.options.map(opt => `
                  <div class="option-row ${selectedOptions.has(opt.id) ? 'selected' : ''}" onclick="toggleOption('${opt.id}')">
                    <div style="display:flex; align-items:center; gap:10px;">
                      <div class="icon-box">📹</div>
                      <div>
                        <div style="font-weight:700; font-size:14px;">${opt.label}</div>
                        <div style="font-size:11px; color:var(--text-muted);">Field Option</div>
                      </div>
                    </div>
                    <div style="font-weight:800; color:var(--accent-red);">+$${opt.price.toFixed(2)}</div>
                  </div>
                `).join('')}
              </div>
              <button class="primary-btn">Confirm Field Adjustment</button>
            </div>`;
      }
    }

    // Setup & Event Listeners
    const selectEl = document.getElementById('conceptSelect');
    const sheetWrapper = document.getElementById('sheetWrapper');
    const themeBtn = document.getElementById('themeBtn');

    // Populate Select Dropdown
    concepts.forEach((name, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = name;
      selectEl.appendChild(opt);
    });

    function renderAllSheets() {
      sheetWrapper.innerHTML = generateSheetHTML(currentConcept);
    }

    function setCurrentConcept(idx) {
      if (idx < 0) idx = concepts.length - 1;
      if (idx >= concepts.length) idx = 0;
      currentConcept = idx;
      selectEl.value = currentConcept;
      renderAllSheets();
    }

    document.getElementById('prevBtn').addEventListener('click', () => setCurrentConcept(currentConcept - 1));
    document.getElementById('nextBtn').addEventListener('click', () => setCurrentConcept(currentConcept + 1));
    selectEl.addEventListener('change', (e) => setCurrentConcept(parseInt(e.target.value)));

    // Dark/Light Theme Switching
    themeBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      document.getElementById('themeIcon').textContent = newTheme === 'dark' ? '☀️' : '🌙';
      document.getElementById('themeText').textContent = newTheme === 'dark' ? 'Light' : 'Dark';
    });

    // Initial Initialization
    renderAllSheets();
  </script>
</body>
</html>
