<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MLS Full Shoot - 30 Operational Bottom Sheet Redesigns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-red: #E50914;
      --brand-red-hover: #CC0000;
      --brand-red-subtle: rgba(229, 9, 20, 0.12);
      
      /* Dark Theme Tokens (Default) */
      --bg-page: #050505;
      --bg-sheet: #111111;
      --bg-surface: #1C1C1E;
      --bg-surface-hover: #2C2C2E;
      --border-color: #2C2C2E;
      --border-strong: #3A3A3C;
      --text-main: #FFFFFF;
      --text-muted: #8E8E93;
      --text-inverse: #000000;
      --card-shadow: 0 24px 48px rgba(0,0,0,0.8);
      --toggle-bg: #2C2C2E;
      --toggle-active-bg: #FFFFFF;
      --toggle-active-text: #000000;
    }

    [data-theme="light"] {
      --bg-page: #E5E5EA;
      --bg-sheet: #FFFFFF;
      --bg-surface: #F2F2F7;
      --bg-surface-hover: #E5E5EA;
      --border-color: #D1D1D6;
      --border-strong: #C7C7CC;
      --text-main: #000000;
      --text-muted: #6C6C70;
      --text-inverse: #FFFFFF;
      --card-shadow: 0 16px 36px rgba(0,0,0,0.12);
      --toggle-bg: #E5E5EA;
      --toggle-active-bg: #000000;
      --toggle-active-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
    }

    /* Pinned Top Navigation Bar */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 2000;
      width: 100%;
      background: var(--bg-sheet);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .nav-left, .nav-right, .nav-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .brand-title .badge {
      background: var(--brand-red);
      color: #FFF;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .nav-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }

    .nav-btn:hover {
      background: var(--bg-surface-hover);
      border-color: var(--brand-red);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: var(--border-color);
    }

    .option-select {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      min-height: 40px;
      max-width: 280px;
    }

    .theme-toggle {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }

    .view-mode-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
    }

    .view-mode-btn.active {
      background: var(--brand-red);
      color: #FFFFFF;
      border-color: var(--brand-red);
    }

    /* Main Container Stage */
    .main-stage {
      width: 100%;
      max-width: 1350px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Single Mobile Stage Frame */
    .stage-single {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stage-header {
      text-align: center;
      margin-bottom: 20px;
      max-width: 650px;
    }

    .stage-header h2 {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .stage-header p {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
    }

    /* Mobile Device Outer Frame */
    .mobile-frame {
      width: 100%;
      max-width: 420px;
      background: var(--bg-page);
      border: 10px solid #202022;
      border-radius: 48px;
      box-shadow: var(--card-shadow), 0 0 0 1px rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
      min-height: 680px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .mobile-screen-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 20px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-main);
      z-index: 2;
    }

    /* Shared Components */
    .drag-handle {
      width: 40px;
      height: 5px;
      background: var(--text-muted);
      opacity: 0.4;
      border-radius: 3px;
      margin: 0 auto 16px;
    }

    .bottom-sheet {
      position: relative;
      z-index: 10;
      width: 100%;
      background: var(--bg-sheet);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 20px 24px;
      box-shadow: 0 -12px 36px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
      border-bottom: none;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tax-badge {
      font-size: 10px;
      font-weight: 900;
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 3px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sqft-dropdown {
      width: 100%;
      min-height: 48px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tier-chips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .tier-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
    }

    .tier-chip.active {
      background: var(--toggle-active-bg);
      color: var(--toggle-active-text);
      border-color: var(--toggle-active-bg);
    }

    .tier-chip .photos { font-size: 15px; font-weight: 900; }
    .tier-chip .price { font-size: 12px; font-weight: 700; opacity: 0.8; margin-top: 2px; }

    .line-item-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .line-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
    }

    .line-row.active-highlight {
      background: var(--toggle-active-bg);
      color: var(--toggle-active-text);
    }

    .stepper-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .stepper-ctrl {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 4px 8px;
      gap: 12px;
      min-height: 48px;
    }

    .stepper-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-action-btn {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: none;
      background: var(--toggle-active-bg);
      color: var(--toggle-active-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .fp-icon {
      width: 22px;
      height: 22px;
      stroke: var(--brand-red);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Grid Stage */
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 28px;
      width: 100%;
    }

    .grid-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .grid-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .grid-card-title {
      font-size: 12px;
      font-weight: 900;
      color: var(--brand-red);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ARCHETYPE SPECIFIC CSS EXTENSIONS */
    .opt-2-brutal { border: 3px solid var(--text-main); box-shadow: 6px 6px 0px var(--brand-red); border-radius: 0; }
    .opt-3-stack { position: relative; padding-top: 36px; }
    .opt-3-layer-1 { position: absolute; top: 0; left: 24px; right: 24px; height: 40px; background: var(--brand-red); border-radius: 20px 20px 0 0; opacity: 0.9; }
    .opt-3-layer-2 { position: absolute; top: 12px; left: 12px; right: 12px; height: 40px; background: var(--bg-surface-hover); border-radius: 22px 22px 0 0; }
    .opt-4-ring-box { width: 88px; height: 88px; border-radius: 50%; border: 6px solid var(--brand-red); border-left-color: var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 12px; }
    .opt-5-hero-dock { background: var(--brand-red); color: #FFF; padding: 16px; border-radius: 20px; margin-bottom: 12px; text-align: center; }
    .opt-8-lab { font-family: 'JetBrains Mono', monospace; border-left: 3px solid var(--brand-red); padding-left: 12px; }
    .opt-9-pill-dock { position: absolute; bottom: 16px; left: 16px; right: 16px; background: var(--brand-red); color: #fff; padding: 10px 18px; border-radius: 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 28px rgba(229,9,20,0.4); }
    .opt-11-term { background: #000; color: #00FF66; border: 1px solid #333; font-family: 'JetBrains Mono', monospace; padding: 14px; border-radius: 14px; margin-bottom: 12px; }
    .opt-15-ticket { background: var(--bg-surface); border: 1px dashed var(--border-strong); border-radius: 16px; padding: 14px; position: relative; margin-bottom: 12px; }
    .opt-20-barcode { background: #FFF; color: #000; padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; border-radius: 4px; letter-spacing: 2px; text-align: center; margin-bottom: 10px; }
    .opt-21-split- shade { background: linear-gradient(180deg, var(--bg-sheet) 50%, var(--bg-surface) 50%); border-radius: 28px; }
    .opt-25-bento { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 12px; }
  </style>
</head>
<body data-theme="dark">

  <!-- Pinned Navigation Bar -->
  <header class="nav-bar">
    <div class="nav-left">
      <div class="brand-title">
        FIELD UTIL <span class="badge">30 CONCEPTS</span>
      </div>
    </div>

    <div class="nav-center">
      <button class="nav-btn" id="prevBtn" onclick="navigateOption(-1)">‹ Prev</button>
      <select class="option-select" id="optionSelect" onchange="selectOption(this.value)"></select>
      <button class="nav-btn" id="nextBtn" onclick="navigateOption(1)">Next ›</button>
    </div>

    <div class="nav-right">
      <button class="view-mode-btn active" id="singleViewBtn" onclick="setViewMode('single')">Single View</button>
      <button class="view-mode-btn" id="gridViewBtn" onclick="setViewMode('grid')">All 30 Grid</button>
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span>
      </button>
    </div>
  </header>

  <!-- Main Presentation Stage -->
  <main class="main-stage">
    <!-- SINGLE OPTION PREVIEW STAGE -->
    <div class="stage-single" id="singleStage">
      <div class="stage-header">
        <h2 id="optionTitle">01. Floating Modular Cards</h2>
        <p id="optionDesc">Description goes here</p>
      </div>

      <div class="mobile-frame">
        <div class="mobile-screen-bg">
          <div class="status-bar">
            <span>9:41</span>
            <div style="display: flex; gap: 4px; align-items: center;">
              <span>5G</span>
              <span>100%</span>
            </div>
          </div>
          <div style="text-align: center; color: rgba(255,255,255,0.4); font-size: 11px; margin-top: 24px; font-weight: 700;">
            [ CAMERA VIEWPORT GLANCE OVERLAY ]
          </div>
        </div>

        <div id="sheetSlot"></div>
      </div>
    </div>

    <!-- ALL 30 GRID STAGE -->
    <div class="stage-grid" id="gridStage" style="display: none;"></div>
  </main>

  <script>
    // Pure Source Data Components
    const headerComponent = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="icon-box">
            <svg class="fp-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </div>
          <div>
            <div style="font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.3px;">MLS Photos</div>
            <h1 style="font-size: 20px; font-weight: 900; letter-spacing: -0.4px;">Full Shoot</h1>
          </div>
        </div>
        <div style="text-align: right;">
          <span class="tax-badge">TAX</span>
          <div style="font-size: 28px; font-weight: 900; letter-spacing: -0.8px; margin-top: 2px;">$149<span style="font-size: 16px;">.00</span></div>
        </div>
      </div>
    `;

    const sqftComponent = `
      <div class="sqft-dropdown">
        <span>0 – 1,999 Sq Ft</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    `;

    const tierChipsComponent = `
      <div class="tier-chips">
        <div class="tier-chip active"><div class="photos">25</div><div class="price">$139</div></div>
        <div class="tier-chip"><div class="photos">36</div><div class="price">$179</div></div>
        <div class="tier-chip"><div class="photos">40</div><div class="price">$189</div></div>
        <div class="tier-chip"><div class="photos">50</div><div class="price">$224</div></div>
      </div>
    `;

    const lineItemsComponent = `
      <div class="line-item-box">
        <div class="line-row"><span>Base 25 Photos</span><span>$139</span></div>
        <div class="line-row active-highlight"><span>$5 / Extra × 2</span><span>+$10</span></div>
      </div>
    `;

    const stepperComponent = `
      <div class="stepper-row">
        <span style="font-size: 15px; font-weight: 800;">Total Photos</span>
        <div style="display: flex; gap: 8px; align-items: center;">
          <div class="stepper-ctrl">
            <button class="stepper-btn">−</button>
            <span style="font-size: 16px; font-weight: 900;">27</span>
            <button class="stepper-btn">+</button>
          </div>
          <button class="cart-action-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/><path d="M12 9h6M15 6v6"/></svg>
          </button>
        </div>
      </div>
    `;

    // 30 Radically Distinct Layout Archetype Concepts
    const optionsData = [
      {
        title: "01. Floating Modular Cards",
        desc: "Detached floating surfaces layered over a dimmed backdrop with elevated z-index depth.",
        render: () => `<div class="bottom-sheet" style="background:transparent; border:none; box-shadow:none; padding:0 12px 16px;">
          <div style="background:var(--bg-sheet); border:1px solid var(--border-color); border-radius:24px; padding:16px; margin-bottom:10px;">${headerComponent}</div>
          <div style="background:var(--bg-sheet); border:1px solid var(--border-color); border-radius:24px; padding:16px;">${sqftComponent}${tierChipsComponent}${lineItemsComponent}${stepperComponent}</div>
        </div>`
      },
      {
        title: "02. Neo-Brutalist High-Border",
        desc: "Cash App inspired heavy black borders, stark drop shadows, and high-visibility red accents.",
        render: () => `<div class="bottom-sheet opt-2-brutal"><div class="drag-handle" style="background:var(--text-main); opacity:1;"></div>${headerComponent}${sqftComponent}${tierChipsComponent}${lineItemsComponent}${stepperComponent}</div>`
      },
      {
        title: "03. Skeuomorphic Pass Stack",
        desc: "Apple Wallet inspired card stack depth with physical layering and tactile fan-out.",
        render: () => `<div class="bottom-sheet opt-3-stack"><div class="opt-3-layer-1"></div><div class="opt-3-layer-2"></div><div class="drag-handle"></div>${headerComponent}${sqftComponent}${tierChipsComponent}${lineItemsComponent}${stepperComponent}</div>`
      },
      {
        title: "04. Metric Ring Focus",
        desc: "Oura inspired circular progress ring visually framing the hero total price at the top center.",
        render: () => `<div class="bottom-sheet"><div class="drag-handle"></div><div class="opt-4-ring-box"><span class="tax-badge" style="font-size:8px; padding:1px 4px;">TAX</span><div style="font-size:20px; font-weight:900;">$149</div></div><div style="text-align:center; margin-bottom:10px;"><h2 style="font-size:20px; font-weight:900;">Full Shoot</h2><div style="font-size:11px; font-weight:800; color:var(--text-muted);">MLS Photos</div></div>${sqftComponent}${tierChipsComponent}${lineItemsComponent}${stepperComponent}</div>`
      },
      {
        title: "05. Split-Screen Hero Dock",
        desc: "Top portion locked to high-contrast red hero price dock topping option controls.",
        render: () => `<div class="bottom-sheet"><div class="drag-handle"></div><div class="opt-5-hero-dock"><div style="display:flex; justify-content:space-between; align-items:center;"><div><span style="font-size:10px; font-weight:800; opacity:0.8;">MLS PHOTOS</span><h2 style="font-size:20px; font-weight:900;">Full Shoot</h2></div><div style="text-align:right;"><span class="tax-badge" style="background:rgba(0,0,0,0.3); color:#fff; border:none;">TAX</span><div style="font-size:28px; font-weight:900;">$149.00</div></div></div></div>${sqftComponent}${tierChipsComponent}${lineItemsComponent}${stepperComponent}</div>`
      },
      {
        title: "06. Accordion Stacks",
        desc: "Collapsible operational groups maximizing vertical screen real estate for direct glanceability.",
        render: () => `<div class="bottom-sheet"><div class="drag-handle"></div>${headerComponent}<div style="border:1px solid var(--border-color); border-radius:16px; padding:12px; margin-bottom:10px;"><div style="font-weight:800; font-size:13px; margin-bottom:8px;">1. PROPERTY SIZE & TIERS</div>${sqftComponent}${tierChipsComponent}</div><div style="border:1px solid var(--border-color); border-radius:16px; padding:12px;">${lineItemsComponent}${stepperComponent}</div></div>`
      },
      {
        title: "07. Segmented Stepper / Multi-Tab",
        desc: "Horizontal category tabs splitting complex options into focused sub-sheets.",
        render: () => `<div class="bottom-sheet"><div class="drag-handle"></div>${headerComponent}<div style="display:flex; background:var(--bg-surface); padding:4px; border-radius:12px; margin-bottom:12px; border:1px solid var(--border-color);"><div style="flex:1; text-align:center; padding:8px; background:var(--toggle-active-bg); color:var(--toggle-active-text); font-weight:800; font-size:12px; border-radius:8px;">PACKAGE</div><div style="flex:1; text-align:center; padding:8px; font-weight:800; font-size:12px; color:var(--text-muted);">ADJUSTMENTS</div></div>${sqftComponent}${tierChipsComponent}${stepperComponent}</div>`
      },
      {

      },
      {
        title: "29. Clean Technical Spec",
        desc: "Ultra-precise micro-labels, technical font weights, and crisp high-visibility badges.",
        render: () => `<div class="bottom-sheet"><div class="drag-handle"></div><div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;"><div><span style="font-size:9px; font-weight:900; background:var(--brand-red); color:#fff; padding:2px 6px; border-radius:4px;">VERIFIED SPEC</span><h2 style="font-size:20px; font-weight:900; margin-top:4px;">MLS Full Shoot</h2></div><div style="text-align:right;"><span class="tax-badge">TAX</span><div style="font-size:26px; font-weight:900;">$149.00</div></div></div>${sqftComponent}${tierChipsComponent}${lineItemsComponent}${stepperComponent}</div>`
      },
      {
        title: "30. Floating Total Badge",
        desc: "Total price suspended as an independent high-visibility badge in top corner.",
        render: () => `<div class="bottom-sheet"><div class="drag-handle"></div><div style="position:relative;">${headerComponent}</div>${sqftComponent}${tierChipsComponent}${lineItemsComponent}${stepperComponent}</div>`
      }
    ];

    let currentOptionIndex = 0;
    let currentViewMode = 'single';
    let isDarkMode = true;

    // Populate Navigation Dropdown
    const selectElem = document.getElementById('optionSelect');
    optionsData.forEach((opt, idx) => {
      const optElem = document.createElement('option');
      optElem.value = idx;
      optElem.innerText = `${(idx + 1).toString().padStart(2, '0')} • ${opt.title.split('. ')[1]}`;
      selectElem.appendChild(optElem);
    });

    function renderSingleView() {
      const opt = optionsData[currentOptionIndex];
      document.getElementById('optionTitle').innerText = opt.title;
      document.getElementById('optionDesc').innerText = opt.desc;
      document.getElementById('sheetSlot').innerHTML = opt.render();
      document.getElementById('optionSelect').value = currentOptionIndex;

      document.getElementById('prevBtn').disabled = currentOptionIndex === 0;
      document.getElementById('nextBtn').disabled = currentOptionIndex === optionsData.length - 1;
    }

    function renderGridView() {
      const grid = document.getElementById('gridStage');
      grid.innerHTML = '';
      optionsData.forEach((opt, idx) => {
        const card = document.createElement('div');
        card.className = 'grid-card';
        card.innerHTML = `
          <div class="grid-card-header">
            <span class="grid-card-title">${opt.title}</span>
            <button class="nav-btn" style="padding: 4px 10px; font-size: 11px; min-height: 28px;" onclick="selectOption(${idx}); setViewMode('single');">Focus</button>
          </div>
          <div>${opt.render()}</div>
        `;
        grid.appendChild(card);
      });
    }

    function selectOption(index) {
      currentOptionIndex = parseInt(index);
      renderSingleView();
    }

    function navigateOption(direction) {
      const newIndex = currentOptionIndex + direction;
      if (newIndex >= 0 && newIndex < optionsData.length) {
        currentOptionIndex = newIndex;
        renderSingleView();
      }
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      if (mode === 'single') {
        document.getElementById('singleStage').style.display = 'flex';
        document.getElementById('gridStage').style.display = 'none';
        document.getElementById('singleViewBtn').classList.add('active');
        document.getElementById('gridViewBtn').classList.remove('active');
        renderSingleView();
      } else {
        document.getElementById('singleStage').style.display = 'none';
        document.getElementById('gridStage').style.display = 'grid';
        document.getElementById('singleViewBtn').classList.remove('active');
        document.getElementById('gridViewBtn').classList.add('active');
        renderGridView();
      }
    }

    function toggleTheme() {
      isDarkMode = !isDarkMode;
      document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
      document.getElementById('themeIcon').innerText = isDarkMode ? '🌙' : '☀️';
      document.getElementById('themeLabel').innerText = isDarkMode ? 'Dark Mode' : 'Light Mode';
      if (currentViewMode === 'grid') renderGridView();
    }

    // Keyboard Arrow Controls
    document.addEventListener('keydown', (e) => {
      if (currentViewMode === 'single') {
        if (e.key === 'ArrowRight') navigateOption(1);
        if (e.key === 'ArrowLeft') navigateOption(-1);
      }
    });

    // Initial Execution
    renderSingleView();
  </script>
