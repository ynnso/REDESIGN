<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>s2s — Theme Switcher</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{ font-family:-apple-system,sans-serif; max-width:430px; margin:0 auto; height:100vh; position:relative; transition:background .3s; }

  .theme-picker{ position:absolute; top:0; left:0; right:0; z-index:50; display:flex; gap:6px; padding:10px 12px; overflow-x:auto; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); }
  .theme-picker::-webkit-scrollbar{display:none;}
  .theme-btn{ flex-shrink:0; padding:7px 12px; border-radius:100px; font-size:11px; font-weight:700; border:1px solid rgba(255,255,255,0.2); background:transparent; color:#aaa; font-family:inherit; }
  .theme-btn.active{ background:#E50914; color:#fff; border-color:#E50914; }

  .screen{ position:absolute; inset:0; padding-top:44px; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  header{ padding:18px 20px 10px; display:flex; justify-content:space-between; align-items:center; }
  .brand{ font-weight:800; font-size:16px; }
  .cart{ font-size:12px; font-weight:700; padding:8px 14px; border-radius:100px; }
  h1{ font-size:26px; font-weight:800; padding:10px 20px 16px; letter-spacing:-0.01em; }

  .grid{ padding:0 16px 100px; display:grid; grid-template-columns:1fr 1fr; gap:12px; overflow-y:auto; }
  .tile{ aspect-ratio:1; border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .tile svg{ width:30px; height:30px; }
  .tile .name{ font-size:15px; font-weight:700; }

  /* ===== APPLE ===== */
  #apple{ background:#000; color:#fff; }
  #apple .cart{ background:#121212; }
  #apple .tile{ background:linear-gradient(155deg,#1c1c1f,#131315); border:0.5px solid rgba(255,255,255,0.08); }
  #apple .tile svg{ color:#E50914; }

  /* ===== WISE ===== */
  #wise{ background:#fff; color:#0A0A0A; }
  #wise .cart{ background:#0A0A0A; color:#fff; }
  #wise .tile{ border:2.5px solid #0A0A0A; }
  #wise .tile:nth-child(3n+2){ background:#0A0A0A; color:#fff; }
  #wise .tile:nth-child(3n+2) svg{ color:#fff; }
  #wise .tile:nth-child(3n){ background:#E50914; color:#fff; border-color:#E50914; }
  #wise .tile:nth-child(3n) svg{ color:#fff; }
  #wise .tile:not(:nth-child(3n+2)):not(:nth-child(3n)) svg{ color:#E50914; }

  /* ===== ROBINHOOD ===== */
  #robinhood{ background:#000; color:#fff; }
  #robinhood .cart{ background:#0d0d0d; border:1px solid #1a1a1a; color:#E50914; }
  #robinhood .tile{ background:#0d0d0d; border:1px solid #1a1a1a; }
  #robinhood .tile svg{ color:#E50914; }

  /* ===== REVOLUT ===== */
  #revolut{ background:#0a0a0a; color:#fff; }
  #revolut .cart{ background:#161616; border:1px solid #2a2a2a; }
  #revolut .tile{ background:linear-gradient(155deg,#1a1a1a,#0d0d0d); border:1px solid #262626; }
  #revolut .tile .icon-wrap{ width:44px; height:44px; border-radius:14px; background:linear-gradient(135deg,#E50914,#8a0510); display:flex; align-items:center; justify-content:center; }
  #revolut .tile svg{ width:22px; height:22px; color:#fff; }

  /* ===== NEUMORPHIC ===== */
  #neumorphic{ background:#e8e2df; color:#3a332f; }
  #neumorphic .cart{ background:#e8e2df; box-shadow:6px 6px 12px #c7c1be, -6px -6px 12px #ffffff; color:#E50914; }
  #neumorphic .tile{ background:#e8e2df; box-shadow:7px 7px 14px #c7c1be, -7px -7px 14px #ffffff; }
  #neumorphic .tile svg{ color:#E50914; }

  /* ===== CURRENT (existing app) ===== */
  #current{ background:#000; color:#fff; }
  #current .cart{ background:#121212; }
  #current h1{ font-size:22px; }
  #current .tile{ background:#121212; border:1px solid #262626; border-radius:24px; }
  #current .tile svg{ color:#fff; }
</style>
</head>
<body>

<div class="theme-picker">
  <button class="theme-btn active" onclick="setTheme('apple', this)">Apple</button>
  <button class="theme-btn" onclick="setTheme('wise', this)">Wise</button>
  <button class="theme-btn" onclick="setTheme('robinhood', this)">Robinhood</button>
  <button class="theme-btn" onclick="setTheme('revolut', this)">Revolut</button>
  <button class="theme-btn" onclick="setTheme('neumorphic', this)">Neumorphic</button>
  <button class="theme-btn" onclick="setTheme('current', this)">Current App</button>
</div>

  <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="4" stroke-width="1.6" fill="none"/><path d="M12 8v8M8 12h8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="name">Add-Ons</div></div>

<div class="screen active" id="apple"><header><div class="brand">s2s</div><div class="cart">Cart · 2</div></header><h1>Services</h1><div class="grid"></div></div>
<div class="screen" id="wise"><header><div class="brand">s2s</div><div class="cart">Cart · 2</div></header><h1>Services</h1><div class="grid"></div></div>
<div class="screen" id="robinhood"><header><div class="brand">S2S</div><div class="cart">● Cart · 2</div></header><h1>Services</h1><div class="grid"></div></div>
<div class="screen" id="revolut"><header><div class="brand">S2S</div><div class="cart">Cart · 2</div></header><h1>Services</h1><div class="grid"></div></div>
<div class="screen" id="neumorphic"><header><div class="brand">S2S</div><div class="cart">Cart · 2</div></header><h1>Services</h1><div class="grid"></div></div>
<div class="screen" id="current"><header><div class="brand">S<span style="color:#E50914">2</span>S</div><div class="cart">Cart · 2</div></header><h1>Services</h1><div class="grid"></div></div>

<script>
  const markup = document.getElementById('tileMarkup').textContent;
  document.querySelectorAll('.grid').forEach(g => g.innerHTML = markup);

  // Revolut needs icon-wrap treatment
  document.querySelectorAll('#revolut .tile').forEach(tile => {
    const svg = tile.querySelector('svg');
    const wrap = document.createElement('div');
    wrap.className = 'icon-wrap';
    svg.parentNode.insertBefore(wrap, svg);
    wrap.appendChild(svg);
  });

  function setTheme(id, btn){
    document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
</html>
