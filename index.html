<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S2S Real Estate Quoting App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    :root {
      --bg: #e6e9ef; --text-primary: #1e2530; --text-secondary: #64748b;
      --s2s-red: #e60000; --shadow-light: #ffffff; --shadow-dark: #b8bec9;
      --inset-dark: #c1c7d0; --border-radius: 24px; --transition-speed: 0.35s;
    }
    [data-theme="dark"] {
      --bg: #1e232a; --text-primary: #f1f5f9; --text-secondary: #94a3b8;
      --s2s-red: #ff2a2a; --shadow-light: #282e38; --shadow-dark: #14171c; --inset-dark: #12151a;
    }
    
    /* 10 Visual Variants */
    [data-variant="v2"] { --s2s-red: #ff003c; }
    [data-variant="v3"] { --border-radius: 32px; }
    [data-variant="v4"] { --bg: #eef2f5; }
    [data-variant="v5"] { --shadow-dark: #afb6c2; }
    [data-variant="v6"] { --s2s-red: #d90429; }
    [data-variant="v7"] { --bg: #f4f6f9; }
    [data-variant="v8"] { --border-radius: 18px; }
    [data-variant="v9"] { --shadow-dark: #abb2bf; }
    [data-variant="v10"] { --s2s-red: #ef233c; }

    body { background: #0b0d10; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    /* PERSISTENT TOP SWITCHER */
    #switcher-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px; background: #11151c; color: #fff;
      display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 9999; font-size: 12px; border-bottom: 1px solid #222a36;
    }
    .switcher-controls { display: flex; gap: 6px; }
    .switcher-btn, select { background: #222a36; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }

    /* APP CONTAINER */
    #app-container {
      width: 100%; max-width: 412px; height: calc(100vh - 44px); max-height: 840px; margin-top: 44px;
      background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* TOP NAV */
    .top-nav { height: 66px; padding: 10px 20px 0 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    
    .brand-logo-btn {
      padding: 8px 16px; border-radius: 16px; background: var(--bg);
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      display: flex; align-items: center; justify-content: center; border: none; cursor: pointer;
      transition: all 0.2s ease;
    }
    .brand-logo-btn:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); transform: scale(0.95); }
    .brand-logo { font-size: 22px; font-weight: 900; color: var(--text-primary); letter-spacing: -1px; }
    .brand-logo span { color: var(--s2s-red); }

    .nav-actions { display: flex; gap: 12px; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--bg);
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      display: flex; align-items: center; justify-content: center; border: none; color: var(--text-primary); cursor: pointer;
      transition: all 0.2s ease;
    }
    .icon-btn:active { box-shadow: inset 4px 4px 8px var(--inset-dark), inset -4px -4px 8px var(--shadow-light); transform: scale(0.92); }
    .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    /* VIEW CANVAS */
    .view-container { flex: 1; position: relative; overflow: hidden; }
    .screen {
      position: absolute; inset: 0; padding: 16px 20px 80px 20px; opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.32, 0.72, 0, 1); transform: scale(0.95) translateY(20px);
    }
    .screen.active { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }

    /* UNIFIED GRID TILES (PRISTINE NO-PRICE HOME GRID & SCREEN 2 GRID) */
    .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; padding-top: 8px; }
    
    .tile {
      background: var(--bg); border-radius: var(--border-radius);
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
      aspect-ratio: 1 / 1.05; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; position: relative; cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .tile:active { box-shadow: inset 5px 5px 10px var(--inset-dark), inset -5px -5px 10px var(--shadow-light); transform: scale(0.93); }
    
    .drag-handle { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; opacity: 0.25; display: flex; align-items: center; justify-content: center; font-size: 10px; }
    .tile.editing { animation: wiggle 0.25s infinite alternate ease-in-out; border: 2px dashed var(--s2s-red); }
    @keyframes wiggle { 0% { transform: rotate(-1.5deg); } 100% { transform: rotate(1.5deg); } }

    /* Extra-Large Icon Well */
    .icon-well {
      width: 78px; height: 78px; border-radius: 22px; background: var(--bg);
      box-shadow: inset 5px 5px 10px var(--inset-dark), inset -5px -5px 10px var(--shadow-light);
      display: flex; align-items: center; justify-content: center; margin-bottom: 12px; pointer-events: none;
    }
    .icon-well svg { width: 44px; height: 44px; stroke: var(--s2s-red); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .tile-label { font-size: 17px; font-weight: 800; color: var(--text-primary); text-align: center; pointer-events: none; }

    /* SCREEN 2 STAGGER & UPDATED 3-OPTION HEADER */
    .screen-header-s2 { display: flex; flex-direction: column; gap: 14px; margin-bottom: 12px; }
    .s2-top-row { display: flex; align-items: center; gap: 16px; }
    .s2-icon-box {
      width: 52px; height: 52px; border-radius: 16px; background: var(--bg);
      box-shadow: inset 4px 4px 8px var(--inset-dark), inset -4px -4px 8px var(--shadow-light);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .s2-icon-box svg { width: 28px; height: 28px; stroke: var(--s2s-red); fill: none; stroke-width: 2.2; }
    .s2-title { font-size: 26px; font-weight: 900; color: var(--text-primary); letter-spacing: -0.5px; }

    /* 3-Option Header Segmented Control */
    .segmented-control {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; border-radius: 18px;
      background: var(--bg); box-shadow: inset 4px 4px 8px var(--inset-dark), inset -4px -4px 8px var(--shadow-light);
    }
    .segment-btn {
      border: none; background: transparent; padding: 10px 0; border-radius: 14px; font-size: 13px; font-weight: 800;
      color: var(--text-secondary); cursor: pointer; transition: all 0.25s ease; text-align: center;
    }
    .segment-btn.active {
      background: var(--s2s-red); color: #ffffff;
      box-shadow: 4px 4px 8px rgba(230,0,0,0.3), inset 2px 2px 4px rgba(255,255,255,0.2);
    }

    .cascading-tile { opacity: 0; transform: translateY(30px) scale(0.92); transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); }
    .screen.active .cascading-tile:nth-child(1) { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.05s; }
    .screen.active .cascading-tile:nth-child(2) { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.10s; }
    .screen.active .cascading-tile:nth-child(3) { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.15s; }
    .screen.active .cascading-tile:nth-child(4) { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.20s; }
    .screen.active .cascading-tile:nth-child(5) { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.25s; }
    .screen.active .cascading-tile:nth-child(6) { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.30s; }

    /* BOTTOM NAV */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0; height: 68px; background: var(--bg);
      box-shadow: 0 -6px 16px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-around; padding: 0 10px; z-index: 100;
    }
    .bottom-nav .nav-item {
      width: 46px; height: 46px; border-radius: 16px; background: var(--bg);
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      display: flex; align-items: center; justify-content: center; color: var(--text-secondary); border: none; cursor: pointer;
      transition: all 0.2s ease;
    }
    .bottom-nav .nav-item.active { color: var(--s2s-red); box-shadow: inset 4px 4px 8px var(--inset-dark), inset -4px -4px 8px var(--shadow-light); }
    .bottom-nav .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    /* SCREEN 3 BOTTOM SHEET OVERLAY */
    .bottom-sheet-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(5px); z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    .bottom-sheet-overlay.active { opacity: 1; pointer-events: auto; }
    
    .bottom-sheet {
      position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 30px 30px 0 0;
      box-shadow: 0 -10px 35px rgba(0,0,0,0.3); padding: 14px 22px 24px 22px; z-index: 201;
      transform: translateY(100%); transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .bottom-sheet.active { transform: translateY(0); }
    .sheet-handle { width: 44px; height: 5px; border-radius: 3px; background: var(--shadow-dark); margin: 0 auto 12px auto; }
    
    /* HORIZONTAL HEADER ROW (ICON + TITLE SAME ROW) */
    .sheet-header-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 8px; width: 100%; }
    .sheet-header-row .icon-well { width: 54px; height: 54px; margin-bottom: 0; border-radius: 16px; }
    .sheet-header-row .icon-well svg { width: 30px; height: 30px; }
    .sheet-main-title { font-size: 28px; font-weight: 900; color: var(--text-primary); text-shadow: 2px 2px 4px var(--shadow-dark); }

    /* TIGHT & COHESIVE 2X HERO PRICE CONTAINER */
    .hero-price-container {
      margin: 8px 0 14px 0; padding: 10px 24px; border-radius: 20px; background: var(--bg);
      box-shadow: inset 4px 4px 8px var(--inset-dark), inset -4px -4px 8px var(--shadow-light);
      display: flex; align-items: center; justify-content: center; width: 100%; max-width: 260px;
    }
    .sheet-hero-price-2x {
      font-size: 48px; font-weight: 900; color: var(--s2s-red); display: flex; align-items: baseline; justify-content: center;
      line-height: 1; letter-spacing: -1.5px;
    }
    .sheet-hero-price-2x .cents { font-size: 24px; font-weight: 800; margin-left: -1px; }
    .tax-badge-centered { font-size: 10px; font-weight: 800; background: var(--shadow-dark); color: var(--text-primary); padding: 2px 6px; border-radius: 6px; margin-left: 6px; letter-spacing: 0; }

    /* PILLS & STEPPER WITH DEEP TACTILE RECESSED RED */
    .pill-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 14px 0; width: 100%; }
    
    .pill-btn {
      background: var(--bg); border-radius: 16px; padding: 10px 4px; text-align: center;
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); border: none; cursor: pointer;
      transition: all 0.25s ease;
    }
    .pill-btn.active {
      box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.45), inset -2px -2px 5px rgba(255, 255, 255, 0.25);
      background: var(--s2s-red); transform: scale(0.97);
    }
    .pill-btn.active .count, .pill-btn.active .price { color: #ffffff !important; }
    .pill-btn .count { font-size: 15px; font-weight: 800; color: var(--text-primary); }
    .pill-btn .price { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

    .stepper-row {
      display: flex; align-items: center; justify-content: space-between; margin: 2px 0 16px 0; padding: 8px 16px; width: 100%;
      background: var(--bg); border-radius: 18px; box-shadow: inset 4px 4px 8px var(--inset-dark), inset -4px -4px 8px var(--shadow-light);
    }
    .stepper-controls { display: flex; align-items: center; gap: 14px; }
    .step-btn {
      width: 34px; height: 34px; border-radius: 10px; background: var(--bg);
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      border: none; font-weight: 800; font-size: 18px; color: var(--text-primary); cursor: pointer; transition: all 0.15s ease;
    }
    .step-btn:active { box-shadow: inset 3px 3px 6px var(--inset-dark), inset -3px -3px 6px var(--shadow-light); transform: scale(0.92); }
    .step-value { font-size: 17px; font-weight: 900; color: var(--s2s-red); min-width: 24px; text-align: center; }

    /* ICON-ONLY CTA BUTTON (TEXT REMOVED) */
    .compact-cta-bar { display: flex; align-items: center; justify-content: center; width: 100%; }
    .cta-button-icon {
      width: 100%; height: 52px; border-radius: 18px; background: var(--s2s-red); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
      box-shadow: 5px 5px 15px rgba(230, 0, 0, 0.4), 4px 4px 8px var(--shadow-dark); transition: all 0.2s ease;
    }
    .cta-button-icon:active { transform: scale(0.96); box-shadow: inset 4px 4px 8px rgba(0,0,0,0.5); filter: brightness(0.9); }
    .cta-button-icon svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .toast {
      position: absolute; top: 75px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: var(--text-primary); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 800;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3); opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body data-theme="light" data-variant="v1">

  <!-- TOP SWITCHER BAR -->
  <div id="switcher-bar">
    <span>Variant Switcher</span>
    <div class="switcher-controls">
      <button class="switcher-btn" id="prev-var">&lt;</button>
      <select id="variant-select">
        <option value="v1">Variant 1: Classic Red</option>
        <option value="v2">Variant 2: Deep Crimson</option>
        <option value="v3">Variant 3: Soft Radius</option>
        <option value="v4">Variant 4: Slate Sunlight</option>
        <option value="v5">Variant 5: Tactile Dense</option>
        <option value="v6">Variant 6: Red Glow</option>
        <option value="v7">Variant 7: Soft Carbon</option>
        <option value="v8">Variant 8: Compact Field</option>
        <option value="v9">Variant 9: Ultra-Contrast</option>
        <option value="v10">Variant 10: S2S Matte</option>
      </select>
      <button class="switcher-btn" id="next-var">&gt;</button>
    </div>
  </div>

  <!-- APP CONTAINER -->
  <div id="app-container">
    <div class="toast" id="toast">Added to Quote!</div>

    <!-- TOP NAVIGATION -->
    <header class="top-nav">
      <button class="brand-logo-btn" id="logo-btn" aria-label="S2S Home">
        <div class="brand-logo">s2<span>s</span></div>
      </button>

      <div class="nav-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle Theme">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button class="icon-btn" aria-label="Shopping Cart">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </button>
      </div>
    </header>

    <main class="view-container">

      <!-- SCREEN 1: PRISTINE HOME SCREEN (NO PRICES) -->
      <section class="screen active" id="screen-1">
        <div class="grid-container" id="home-grid">
          
          <div class="tile">
            <div class="drag-handle" data-deadzone="true">:::</div>
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
            <div class="tile-label">Photos</div>
          </div>

          <div class="tile">
            <div class="drag-handle" data-deadzone="true">:::</div>
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="tile-label">Aerial</div>
          </div>

          <div class="tile">
            <div class="drag-handle" data-deadzone="true">:::</div>
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 9h6M3 15h6"/></svg>
            </div>
            <div class="tile-label">Floor Plan</div>
          </div>

          <div class="tile">
            <div class="drag-handle" data-deadzone="true">:::</div>
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            </div>
            <div class="tile-label">Video</div>
          </div>

          <div class="tile">
            <div class="drag-handle" data-deadzone="true">:::</div>
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/></svg>
            </div>
            <div class="tile-label">360 Tour</div>
          </div>

          <div class="tile">
            <div class="drag-handle" data-deadzone="true">:::</div>
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            </div>
            <div class="tile-label">Add-Ons</div>
          </div>

        </div>
      </section>

      <!-- SCREEN 2: PHOTOS GRID VIEW (NEW 3-OPTION HEADER) -->
      <section class="screen" id="screen-2">
        <div class="screen-header-s2">
          <div class="s2-top-row">
            <div class="s2-icon-box" id="back-to-1">
              <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
            <div class="s2-title">Photos</div>
          </div>
          <div class="segmented-control">
            <button class="segment-btn active">MLS</button>
            <button class="segment-btn">Airbnb</button>
            <button class="segment-btn">PORT</button>
          </div>
        </div>

        <div class="grid-container">
          
          <div class="tile cascading-tile" id="open-full-shoot">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3"/></svg>
            </div>
            <div class="tile-label">Full Shoot</div>
          </div>

          <div class="tile cascading-tile">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            </div>
            <div class="tile-label">Reshoot</div>
          </div>

          <div class="tile cascading-tile">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
            </div>
            <div class="tile-label">Ranch Shoot</div>
          </div>

          <div class="tile cascading-tile">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div class="tile-label">Exterior Only</div>
          </div>

          <div class="tile cascading-tile">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="3" x2="12" y2="9"/></svg>
            </div>
            <div class="tile-label">Mini Shoot</div>
          </div>

          <div class="tile cascading-tile">
            <div class="icon-well">
              <svg viewBox="0 0 24 24"><path d="M10 20l4-16M6 8l-4 4 4 4M18 8l4 4-4 4"/></svg>
            </div>
            <div class="tile-label">Airbnb</div>
          </div>

        </div>
      </section>

    </main>

    <!-- SCREEN 3: FULL SHOOT BOTTOM SHEET OVERLAY -->
    <div class="bottom-sheet-overlay" id="sheet-overlay">
      <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-handle"></div>
        
        <!-- Header Row (Icon & Title inline on same row) -->
        <div class="sheet-header-row">
          <div class="icon-well">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3"/></svg>
          </div>
          <h1 class="sheet-main-title">Photos</h1>
        </div>

        <!-- Tight & Cohesive 2X Hero Price Container -->
        <div class="hero-price-container">
          <div class="sheet-hero-price-2x">
            $<span id="hero-price">139</span><span class="cents">.00</span>
            <span class="tax-badge-centered">Tax</span>
          </div>
        </div>

        <!-- Pill Selector with Deep Recessed Tactile Red Accent -->
        <div class="pill-selector">
          <button class="pill-btn active" data-price="139" data-photos="25">
            <div class="count">25</div>
            <div class="price">$139</div>
          </button>
          <button class="pill-btn" data-price="179" data-photos="36">
            <div class="count">36</div>
            <div class="price">$179</div>
          </button>
          <button class="pill-btn" data-price="189" data-photos="40">
            <div class="count">40</div>
            <div class="price">$189</div>
          </button>
          <button class="pill-btn" data-price="224" data-photos="50">
            <div class="count">50</div>
            <div class="price">$224</div>
          </button>
        </div>

        <div class="stepper-row">
          <span style="font-size: 14px; font-weight: 800; color: var(--text-primary);">Total Photos</span>
          <div class="stepper-controls">
            <button class="step-btn" id="step-minus">-</button>
            <span class="step-value" id="photo-count">25</span>
            <button class="step-btn" id="step-plus">+</button>
          </div>
        </div>

        <!-- Icon-Only CTA Button (+ & Cart Icon, No Text) -->
        <div class="compact-cta-bar">
          <button class="cta-button-icon" id="add-to-cart-btn" aria-label="Add to Quote">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <button class="nav-item active" id="bnav-1">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="nav-item" id="bnav-2">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </button>
    </nav>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const screen1 = document.getElementById('screen-1');
      const screen2 = document.getElementById('screen-2');
      const bnav1 = document.getElementById('bnav-1');
      const bnav2 = document.getElementById('bnav-2');
      const backTo1 = document.getElementById('back-to-1');
      const logoBtn = document.getElementById('logo-btn');

      function goToScreen(num) {
        if (num === 1) {
          screen1.classList.add('active'); screen2.classList.remove('active');
          bnav1.classList.add('active'); bnav2.classList.remove('active');
        } else if (num === 2) {
          screen1.classList.remove('active'); screen2.classList.add('active');
          bnav1.classList.remove('active'); bnav2.classList.add('active');
        }
      }

      bnav1.addEventListener('click', () => goToScreen(1));
      bnav2.addEventListener('click', () => goToScreen(2));
      backTo1.addEventListener('click', () => goToScreen(1));
      logoBtn.addEventListener('click', () => goToScreen(1));

      // DEAD-ZONE LONG PRESS LOGIC
      const homeTiles = document.querySelectorAll('#home-grid .tile');
      let pressTimer = null;

      homeTiles.forEach(tile => {
        tile.addEventListener('click', (e) => {
          if (e.target.dataset.deadzone === "true") return;
          if (!tile.classList.contains('editing')) goToScreen(2);
        });

        const handle = tile.querySelector('.drag-handle');
        if (handle) {
          const startHold = (e) => {
            e.stopPropagation();
            pressTimer = setTimeout(() => {
              tile.classList.toggle('editing');
              showToast('Edit Mode Triggered');
            }, 600);
          };
          const cancelHold = () => clearTimeout(pressTimer);
          handle.addEventListener('touchstart', startHold); handle.addEventListener('touchend', cancelHold);
          handle.addEventListener('mousedown', startHold); handle.addEventListener('mouseup', cancelHold);
        }
      });

      // SEGMENTED CONTROL IN SCREEN 2
      const segments = document.querySelectorAll('.segment-btn');
      segments.forEach(seg => {
        seg.addEventListener('click', () => {
          segments.forEach(s => s.classList.remove('active'));
          seg.classList.add('active');
        });
      });

      // SCREEN 3 BOTTOM SHEET OVERLAY
      const openSheetBtn = document.getElementById('open-full-shoot');
      const sheetOverlay = document.getElementById('sheet-overlay');
      const bottomSheet = document.getElementById('bottom-sheet');

      openSheetBtn.addEventListener('click', () => {
        sheetOverlay.classList.add('active'); bottomSheet.classList.add('active');
      });
      sheetOverlay.addEventListener('click', (e) => {
        if (e.target === sheetOverlay) {
          sheetOverlay.classList.remove('active'); bottomSheet.classList.remove('active');
        }
      });

      // STEPPER & PILLS
      const heroPrice = document.getElementById('hero-price');
      const photoCount = document.getElementById('photo-count');
      const pillBtns = document.querySelectorAll('.pill-btn');
      let currentPrice = 139, currentPhotos = 25;

      pillBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          pillBtns.forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          currentPrice = parseInt(btn.dataset.price);
          currentPhotos = parseInt(btn.dataset.photos);
          heroPrice.textContent = currentPrice;
          photoCount.textContent = currentPhotos;
        });
      });

      document.getElementById('step-minus').addEventListener('click', () => {
        if (currentPhotos > 15) {
          currentPhotos -= 1; currentPrice = Math.max(89, currentPrice - 5);
          heroPrice.textContent = currentPrice; photoCount.textContent = currentPhotos;
        }
      });
      document.getElementById('step-plus').addEventListener('click', () => {
        currentPhotos += 1; currentPrice += 5;
        heroPrice.textContent = currentPrice; photoCount.textContent = currentPhotos;
      });

      // TOAST & ADD TO CART
      const toast = document.getElementById('toast');
      function showToast(msg) {
        toast.textContent = msg; toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }
      document.getElementById('add-to-cart-btn').addEventListener('click', () => {
        sheetOverlay.classList.remove('active'); bottomSheet.classList.remove('active');
        showToast('Photos Package Added to Quote!');
      });

      // THEME & VARIANT SWITCHER
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const cur = document.body.getAttribute('data-theme');
        document.body.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
      });

      const varSelect = document.getElementById('variant-select');
      varSelect.addEventListener('change', (e) => document.body.setAttribute('data-variant', e.target.value));
      document.getElementById('prev-var').addEventListener('click', () => {
        if (varSelect.selectedIndex > 0) { varSelect.selectedIndex--; varSelect.dispatchEvent(new Event('change')); }
      });
      document.getElementById('next-var').addEventListener('click', () => {
        if (varSelect.selectedIndex < varSelect.options.length - 1) { varSelect.selectedIndex++; varSelect.dispatchEvent(new Event('change')); }
      });
    });
  </script>
</body>
</html>
